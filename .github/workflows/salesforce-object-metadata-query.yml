name: Salesforce Object Metadata Query

on:
  repository_dispatch:
    types:
      - cursor-ask-object-metadata-query

  workflow_dispatch:
    inputs:
      environment_name:
        description: 快照目录中的环境名称
        required: false
        default: DEV
        type: string

permissions:
  contents: write

concurrency:
  group: salesforce-object-metadata-query
  cancel-in-progress: false

env:
  SNAPSHOT_ROOT: org-metadata-snapshots
  TZ: Asia/Shanghai
  SOURCE_API_VERSION: "67.0"

jobs:
  retrieve-object-metadata:
    name: Retrieve object metadata from DEV auth URL org
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Salesforce CLI
        shell: bash
        run: |
          set -euo pipefail

          npm install --global @salesforce/cli
          sf --version

      - name: Authenticate org from DEV_SFDX_AUTH_URL
        shell: bash
        env:
          SFDX_AUTH_URL: ${{ secrets.DEV_SFDX_AUTH_URL }}
        run: |
          set -euo pipefail

          if [ -z "${SFDX_AUTH_URL:-}" ]; then
            echo "::error::未配置 GitHub Secret：DEV_SFDX_AUTH_URL"
            exit 1
          fi

          AUTH_FILE="${RUNNER_TEMP}/salesforce-sfdx-auth-url.txt"

          cleanup() {
            rm -f "$AUTH_FILE"
          }

          trap cleanup EXIT

          printf '%s' "$SFDX_AUTH_URL" > "$AUTH_FILE"
          chmod 600 "$AUTH_FILE"

          sf org login sfdx-url \
            --sfdx-url-file "$AUTH_FILE" \
            --set-default

          ORG_USERNAME="$(
            sf org display \
              --json \
              | jq -r '.result.username'
          )"

          ORG_ID="$(
            sf org display \
              --json \
              | jq -r '.result.id'
          )"

          if [ -z "$ORG_USERNAME" ] || [ "$ORG_USERNAME" = "null" ]; then
            echo "::error::无法从 DEV_SFDX_AUTH_URL 登录结果中识别 org username。"
            exit 1
          fi

          if [ -z "$ORG_ID" ] || [ "$ORG_ID" = "null" ]; then
            echo "::error::无法从 DEV_SFDX_AUTH_URL 登录结果中识别 org id。"
            exit 1
          fi

          echo "ORG_USERNAME=${ORG_USERNAME}" >> "$GITHUB_ENV"
          echo "ORG_ID=${ORG_ID}" >> "$GITHUB_ENV"
          echo "Authenticated Salesforce org from DEV_SFDX_AUTH_URL."

      - name: Prepare SFDX snapshot project
        shell: bash
        env:
          RAW_ENVIRONMENT_NAME: ${{ github.event.client_payload.environment_name || inputs.environment_name || 'DEV' }}
        run: |
          set -euo pipefail

          ENVIRONMENT_NAME="$(
            python3 <<'PYTHON'
          import os
          import re

          raw_environment = os.environ.get(
              "RAW_ENVIRONMENT_NAME",
              "",
          ).strip()

          environment = raw_environment or "DEV"
          environment = re.sub(r"[^A-Za-z0-9_-]+", "-", environment)
          environment = environment.strip("-_") or "DEV"

          print(environment.upper())
          PYTHON
          )"

          TODAY="$(date +'%Y%m%d')"
          DATE_ROOT="${SNAPSHOT_ROOT}/${TODAY}-${ENVIRONMENT_NAME}"
          SNAPSHOT_DIR="${DATE_ROOT}/object-metadata"

          rm -rf "$SNAPSHOT_DIR"

          mkdir -p "$SNAPSHOT_DIR/force-app/main/default"
          mkdir -p "$SNAPSHOT_DIR/manifest"

          cat > "$SNAPSHOT_DIR/sfdx-project.json" <<JSON
          {
            "packageDirectories": [
              {
                "path": "force-app",
                "default": true
              }
            ],
            "namespace": "",
            "sourceApiVersion": "${SOURCE_API_VERSION}"
          }
          JSON

          cat > "$SNAPSHOT_DIR/.gitignore" <<'GITIGNORE'
          .sf/
          .sfdx/
          node_modules/
          GITIGNORE

          echo "ENVIRONMENT_NAME=${ENVIRONMENT_NAME}" >> "$GITHUB_ENV"
          echo "TODAY=${TODAY}" >> "$GITHUB_ENV"
          echo "DATE_ROOT=${DATE_ROOT}" >> "$GITHUB_ENV"
          echo "SNAPSHOT_DIR=${SNAPSHOT_DIR}" >> "$GITHUB_ENV"

          echo "Snapshot directory: ${SNAPSHOT_DIR}"

      - name: Configure default org for snapshot project
        shell: bash
        run: |
          set -euo pipefail

          cd "$SNAPSHOT_DIR"

          sf config set "target-org=${ORG_USERNAME}"
          sf config get target-org

      - name: Generate object metadata manifest
        shell: bash
        run: |
          set -euo pipefail

          cd "$SNAPSHOT_DIR"

          OBJECT_METADATA_TYPES=(
            "CustomObject"
            "CustomField"
            "RecordType"
            "BusinessProcess"
            "CompactLayout"
            "Layout"
            "ListView"
            "ValidationRule"
            "FieldSet"
            "WebLink"
            "SharingRules"
            "CustomTab"
          )

          METADATA_ARGUMENTS=()

          for METADATA_TYPE in "${OBJECT_METADATA_TYPES[@]}"; do
            METADATA_ARGUMENTS+=(
              --metadata
              "$METADATA_TYPE"
            )
          done

          sf project generate manifest \
            --from-org "$ORG_USERNAME" \
            "${METADATA_ARGUMENTS[@]}" \
            --output-dir manifest \
            --type package

          if [ ! -s "manifest/package.xml" ]; then
            echo "::error::对象 metadata manifest/package.xml 未生成或内容为空。"
            exit 1
          fi

      - name: Retrieve object metadata in SFDX format
        shell: bash
        run: |
          set -euo pipefail

          cd "$SNAPSHOT_DIR"

          sf project retrieve start \
            --manifest manifest/package.xml \
            --ignore-conflicts \
            --wait 120

          METADATA_FILE_COUNT="$(
            find force-app/main/default \
              -type f \
              | wc -l \
              | tr -d '[:space:]'
          )"

          if [ "$METADATA_FILE_COUNT" -eq 0 ]; then
            echo "::error::没有下载到任何对象 metadata 文件。"
            exit 1
          fi

          echo "METADATA_FILE_COUNT=${METADATA_FILE_COUNT}" >> "$GITHUB_ENV"

      - name: Generate retrieved metadata manifest
        shell: bash
        run: |
          set -euo pipefail

          cd "$SNAPSHOT_DIR"

          mkdir -p retrieved-manifest

          sf project generate manifest \
            --source-dir force-app \
            --output-dir retrieved-manifest \
            --type package

          if [ ! -s "retrieved-manifest/package.xml" ]; then
            echo "::error::无法根据下载结果生成 retrieved manifest。"
            exit 1
          fi

          mv \
            retrieved-manifest/package.xml \
            manifest/retrieved-package.xml

          rmdir retrieved-manifest

      - name: Generate metadata name list
        shell: bash
        run: |
          set -euo pipefail

          cd "$SNAPSHOT_DIR"

          read -r METADATA_NAME_COUNT METADATA_TYPE_COUNT < <(
            python3 <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          namespace = {"m": "http://soap.sforce.com/2006/04/metadata"}
          manifest_file = Path("manifest/retrieved-package.xml")

          root = ET.parse(manifest_file).getroot()

          metadata_names = set()
          metadata_types = set()

          for type_element in root.findall("m:types", namespace):
              type_name_element = type_element.find("m:name", namespace)

              if type_name_element is not None and type_name_element.text:
                  metadata_types.add(type_name_element.text.strip())

              for member_element in type_element.findall(
                  "m:members",
                  namespace,
              ):
                  if member_element.text:
                      metadata_names.add(member_element.text.strip())

          output_file = Path("METADATA_LIST.txt")
          output_text = "\n".join(sorted(metadata_names, key=str.casefold))

          if output_text:
              output_text += "\n"

          output_file.write_text(output_text, encoding="utf-8")

          print(len(metadata_names), len(metadata_types))
          PYTHON
          )

          if [ ! -s "METADATA_LIST.txt" ]; then
            echo "::error::对象 metadata 名称清单为空。"
            exit 1
          fi

          echo "METADATA_NAME_COUNT=${METADATA_NAME_COUNT}" >> "$GITHUB_ENV"
          echo "METADATA_TYPE_COUNT=${METADATA_TYPE_COUNT}" >> "$GITHUB_ENV"

      - name: Generate snapshot information
        shell: bash
        run: |
          set -euo pipefail

          GENERATED_AT="$(date +'%Y-%m-%d %H:%M:%S %Z')"

          cat > "$SNAPSHOT_DIR/SNAPSHOT_INFO.md" <<EOF
          # Salesforce Object Metadata Snapshot

          - Environment: ${ENVIRONMENT_NAME}
          - Source secret: DEV_SFDX_AUTH_URL
          - Authenticated org username: ${ORG_USERNAME}
          - Authenticated org id: ${ORG_ID}
          - Snapshot date: ${TODAY}
          - Generated at: ${GENERATED_AT}
          - Timezone: Asia/Shanghai
          - Source format: Salesforce DX Source Format
          - Metadata type count: ${METADATA_TYPE_COUNT}
          - Metadata name count: ${METADATA_NAME_COUNT}
          - Metadata file count: ${METADATA_FILE_COUNT}
          - Metadata list: METADATA_LIST.txt

          This snapshot was retrieved from the org identified by
          DEV_SFDX_AUTH_URL. The retrieve command does not specify a
          hard-coded target org parameter.
          EOF

      - name: Write workflow summary
        shell: bash
        run: |
          {
            echo "## Salesforce Object Metadata Query"
            echo ""
            echo "| 项目 | 结果 |"
            echo "|---|---|"
            echo "| 环境 | ${ENVIRONMENT_NAME} |"
            echo "| 认证来源 | DEV_SFDX_AUTH_URL |"
            echo "| Org Username | ${ORG_USERNAME} |"
            echo "| Org Id | ${ORG_ID} |"
            echo "| 快照目录 | \`${SNAPSHOT_DIR}\` |"
            echo "| Metadata 类型数 | ${METADATA_TYPE_COUNT} |"
            echo "| Metadata 名称数 | ${METADATA_NAME_COUNT} |"
            echo "| Metadata 文件数 | ${METADATA_FILE_COUNT} |"
            echo "| 清单文件 | \`${SNAPSHOT_DIR}/METADATA_LIST.txt\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit metadata snapshot
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$DATE_ROOT"

          if git diff --cached --quiet; then
            echo "对象 metadata 查询结果没有变化，无需提交。"
            exit 0
          fi

          git commit \
            -m "chore(metadata): query object metadata ${ENVIRONMENT_NAME} ${TODAY}"

          git pull --rebase origin main
          git push origin HEAD:main

          echo "Object metadata snapshot committed successfully."
