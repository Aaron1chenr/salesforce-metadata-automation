name: Salesforce Metadata Query

on:
  repository_dispatch:
    types:
      - cursor-ask-metadata-query

  workflow_dispatch:
    inputs:
      query:
        description: 自然语言查询，例如：查询org中的所有metadata；查询org中的所有对象metadata
        required: false
        default: ""
        type: string

      scope:
        description: Metadata 查询范围；填写 query 时会自动推断并覆盖该值
        required: false
        default: all
        type: choice
        options:
          - all
          - objects

      environment_name:
        description: 快照目录中的环境名称
        required: false
        default: DEV
        type: string

permissions:
  contents: write

concurrency:
  group: salesforce-metadata-query
  cancel-in-progress: false

env:
  # Metadata 快照根目录
  SNAPSHOT_ROOT: org-metadata-snapshots

  # 中国标准时间
  TZ: Asia/Shanghai

  # 降低大型 Org 查询 Metadata 时的并发
  SF_LIST_METADATA_BATCH_SIZE: "5"

  # Salesforce Summer '26 API Version
  SOURCE_API_VERSION: "67.0"

jobs:
  retrieve-metadata:
    name: Retrieve Salesforce Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      # ============================================================
      # 1. 检出 main 分支
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ============================================================
      # 2. 安装 Salesforce CLI
      # ============================================================
      - name: Install Salesforce CLI
        shell: bash
        run: |
          set -euo pipefail

          npm install --global @salesforce/cli

          echo "Salesforce CLI version:"
          sf --version

      # ============================================================
      # 3. 使用 DEV_SFDX_AUTH_URL 登录并识别目标 Org
      #
      # 不设置 Alias。
      # 不使用 --set-default。
      # 不使用 --target-org。
      #
      # 从登录结果中取得真实用户名，然后设置 SF_TARGET_ORG。
      # ============================================================
      - name: Authenticate and detect Salesforce org
        shell: bash
        env:
          SFDX_AUTH_URL: ${{ secrets.DEV_SFDX_AUTH_URL }}
        run: |
          set -euo pipefail

          if [ -z "${SFDX_AUTH_URL:-}" ]; then
            echo "::error::未配置 GitHub Secret：DEV_SFDX_AUTH_URL"
            exit 1
          fi

          AUTH_FILE="${RUNNER_TEMP}/salesforce-sfdx-auth-url.txt"

          cleanup() {
            rm -f "$AUTH_FILE"
          }

          trap cleanup EXIT

          printf '%s' "$SFDX_AUTH_URL" > "$AUTH_FILE"
          chmod 600 "$AUTH_FILE"

          echo "Authenticating Salesforce Org from DEV_SFDX_AUTH_URL..."

          LOGIN_RESULT="$(
            sf org login sfdx-url \
              --sfdx-url-file "$AUTH_FILE" \
              --json
          )"

          DETECTED_ORG_USERNAME="$(
            printf '%s' "$LOGIN_RESULT" \
              | jq -r '.result.username // empty'
          )"

          DETECTED_ORG_ID="$(
            printf '%s' "$LOGIN_RESULT" \
              | jq -r '.result.orgId // empty'
          )"

          if [ -z "$DETECTED_ORG_USERNAME" ]; then
            echo "::error::无法从 DEV_SFDX_AUTH_URL 登录结果中识别 Salesforce 用户名。"
            exit 1
          fi

          if [ -z "$DETECTED_ORG_ID" ]; then
            echo "::error::无法从 DEV_SFDX_AUTH_URL 登录结果中识别 Salesforce Org ID。"
            exit 1
          fi

          # 当前步骤立即生效
          export SF_TARGET_ORG="$DETECTED_ORG_USERNAME"

          # 后续 GitHub Actions 步骤自动使用该 Org
          echo "SF_TARGET_ORG=${DETECTED_ORG_USERNAME}" \
            >> "$GITHUB_ENV"

          echo "DETECTED_ORG_ID=${DETECTED_ORG_ID}" \
            >> "$GITHUB_ENV"

          # 验证 Salesforce CLI 能否通过 SF_TARGET_ORG 识别 Org
          # 此处不使用 --target-org
          sf org display \
            --json \
            > "${RUNNER_TEMP}/salesforce-org-display.json"

          DISPLAYED_ORG_ID="$(
            jq -r \
              '.result.id // .result.orgId // empty' \
              "${RUNNER_TEMP}/salesforce-org-display.json"
          )"

          rm -f "${RUNNER_TEMP}/salesforce-org-display.json"

          if [ -n "$DISPLAYED_ORG_ID" ] \
            && [ "$DISPLAYED_ORG_ID" != "$DETECTED_ORG_ID" ]; then
            echo "::error::SF_TARGET_ORG 识别出的 Org 与登录 Org 不一致。"
            exit 1
          fi

          echo "Salesforce authentication completed."
          echo "Org detected automatically from DEV_SFDX_AUTH_URL."
          echo "Detected Org ID: ${DETECTED_ORG_ID}"

      # ============================================================
      # 4. 创建日期+环境名称目录以及 SFDX 项目
      #
      # 示例：
      # org-metadata-snapshots/
      # └── 20260728-DEV/
      #     ├── all-metadata/
      #     └── object-metadata/
      # ============================================================
      - name: Prepare SFDX snapshot project
        shell: bash
        env:
          RAW_QUERY: >-
            ${{ github.event_name == 'repository_dispatch'
            && (github.event.client_payload.query || '')
            || inputs.query
            || '' }}

          REQUESTED_SCOPE: >-
            ${{ github.event_name == 'repository_dispatch'
            && (github.event.client_payload.scope || 'all')
            || inputs.scope
            || 'all' }}

          RAW_ENVIRONMENT_NAME: >-
            ${{ github.event_name == 'repository_dispatch'
            && (github.event.client_payload.environment_name || 'DEV')
            || inputs.environment_name
            || 'DEV' }}

        run: |
          set -euo pipefail

          read -r QUERY_SCOPE QUERY_SOURCE < <(
            python3 <<'PYTHON'
          import os
          import sys

          raw_query = os.environ.get(
              "RAW_QUERY",
              "",
          ).strip()

          requested_scope = os.environ.get(
              "REQUESTED_SCOPE",
              "",
          ).strip().casefold()

          def infer_scope(query: str) -> str:
              normalized = query.casefold()

              object_keywords = (
                  "对象",
                  "字段",
                  "记录类型",
                  "页面布局",
                  "布局",
                  "object",
                  "objects",
                  "sobject",
                  "sobjects",
                  "field",
                  "fields",
                  "record type",
                  "recordtype",
                  "layout",
              )

              all_keywords = (
                  "所有",
                  "全部",
                  "全量",
                  "完整",
                  "all",
                  "metadata",
                  "metedata",
                  "元数据",
              )

              if any(
                  keyword in normalized
                  for keyword in object_keywords
              ):
                  return "objects"

              if any(
                  keyword in normalized
                  for keyword in all_keywords
              ):
                  return "all"

              return ""

          if raw_query:
              inferred_scope = infer_scope(raw_query)

              if not inferred_scope:
                  print(
                      "::error::无法识别自然语言查询。"
                      "示例：查询org中的所有metadata；"
                      "查询org中的所有对象metadata",
                      file=sys.stderr,
                  )
                  sys.exit(1)

              print(
                  inferred_scope,
                  "natural-language",
              )

          elif requested_scope in {"all", "objects"}:
              print(
                  requested_scope,
                  "scope-input",
              )

          else:
              print(
                  f"::error::不支持的查询范围："
                  f"{requested_scope}",
                  file=sys.stderr,
              )
              sys.exit(1)
          PYTHON
          )

          ENVIRONMENT_NAME="$(
            python3 <<'PYTHON'
          import os
          import re

          raw_environment = os.environ.get(
              "RAW_ENVIRONMENT_NAME",
              "",
          ).strip()

          environment = raw_environment or "DEV"

          environment = re.sub(
              r"[^A-Za-z0-9_-]+",
              "-",
              environment,
          )

          environment = (
              environment.strip("-_")
              or "DEV"
          )

          print(environment.upper())
          PYTHON
          )"

          # TZ 已设置为 Asia/Shanghai
          TODAY="$(date +'%Y%m%d')"

          DATE_ROOT="${SNAPSHOT_ROOT}/${TODAY}-${ENVIRONMENT_NAME}"

          case "$QUERY_SCOPE" in
            all)
              SCOPE_DIRECTORY="all-metadata"
              SCOPE_LABEL="All Metadata"
              ;;

            objects)
              SCOPE_DIRECTORY="object-metadata"
              SCOPE_LABEL="Object Metadata"
              ;;

            *)
              echo "::error::不支持的查询范围：${QUERY_SCOPE}"
              exit 1
              ;;
          esac

          SNAPSHOT_DIR="${DATE_ROOT}/${SCOPE_DIRECTORY}"

          # 同一天重复查询相同范围时，覆盖旧快照
          rm -rf "$SNAPSHOT_DIR"

          mkdir -p \
            "$SNAPSHOT_DIR/force-app/main/default"

          mkdir -p \
            "$SNAPSHOT_DIR/manifest"

          mkdir -p \
            "$SNAPSHOT_DIR/retrieve-manifests"

          cat > "$SNAPSHOT_DIR/sfdx-project.json" <<JSON
          {
            "packageDirectories": [
              {
                "path": "force-app",
                "default": true
              }
            ],
            "namespace": "",
            "sourceApiVersion": "${SOURCE_API_VERSION}"
          }
          JSON

          cat > "$SNAPSHOT_DIR/.gitignore" <<'GITIGNORE'
          .sf/
          .sfdx/
          node_modules/
          GITIGNORE

          echo "QUERY_SCOPE=${QUERY_SCOPE}" \
            >> "$GITHUB_ENV"

          echo "QUERY_SOURCE=${QUERY_SOURCE}" \
            >> "$GITHUB_ENV"

          echo "SCOPE_LABEL=${SCOPE_LABEL}" \
            >> "$GITHUB_ENV"

          echo "SCOPE_DIRECTORY=${SCOPE_DIRECTORY}" \
            >> "$GITHUB_ENV"

          {
            echo "QUERY_TEXT<<QUERY_TEXT_EOF"
            printf '%s\n' "$RAW_QUERY"
            echo "QUERY_TEXT_EOF"
          } >> "$GITHUB_ENV"

          echo "ENVIRONMENT_NAME=${ENVIRONMENT_NAME}" \
            >> "$GITHUB_ENV"

          echo "TODAY=${TODAY}" \
            >> "$GITHUB_ENV"

          echo "DATE_ROOT=${DATE_ROOT}" \
            >> "$GITHUB_ENV"

          echo "SNAPSHOT_DIR=${SNAPSHOT_DIR}" \
            >> "$GITHUB_ENV"

          echo "Query scope: ${QUERY_SCOPE}"
          echo "Query source: ${QUERY_SOURCE}"
          echo "Snapshot directory: ${SNAPSHOT_DIR}"

      # ============================================================
      # 5. 根据查询范围生成 package.xml
      #
      # --from-org 使用的是从 DEV_SFDX_AUTH_URL 自动识别出的用户名。
      # 不是固定 Alias，也不是手工指定的 Org。
      # ============================================================
      - name: Generate query manifest
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SF_TARGET_ORG:-}" ]; then
            echo "::error::未识别到 DEV_SFDX_AUTH_URL 对应的 Salesforce Org。"
            exit 1
          fi

          cd "$SNAPSHOT_DIR"

          if [ "$QUERY_SCOPE" = "all" ]; then
            echo "Querying all discoverable Metadata..."

            sf project generate manifest \
              --from-org "$SF_TARGET_ORG" \
              --output-dir manifest \
              --type package

          elif [ "$QUERY_SCOPE" = "objects" ]; then
            echo "Querying object-related Metadata..."

            OBJECT_METADATA_TYPES=(
              "CustomObject"
              "CustomField"
              "RecordType"
              "BusinessProcess"
              "CompactLayout"
              "Layout"
              "ListView"
              "ValidationRule"
              "FieldSet"
              "WebLink"
              "SharingRules"
            )

            METADATA_ARGUMENTS=()

            for METADATA_TYPE in \
              "${OBJECT_METADATA_TYPES[@]}"
            do
              METADATA_ARGUMENTS+=(
                --metadata
                "$METADATA_TYPE"
              )
            done

            sf project generate manifest \
              --from-org "$SF_TARGET_ORG" \
              "${METADATA_ARGUMENTS[@]}" \
              --output-dir manifest \
              --type package
          fi

          if [ ! -s "manifest/package.xml" ]; then
            echo "::error::manifest/package.xml 未生成或内容为空。"
            exit 1
          fi

          DISCOVERED_TYPE_COUNT="$(
            grep -c '<name>' \
              manifest/package.xml \
              || true
          )"

          echo "DISCOVERED_TYPE_COUNT=${DISCOVERED_TYPE_COUNT}" \
            >> "$GITHUB_ENV"

          echo "Query manifest generated successfully."
          echo "Discovered type count: ${DISCOVERED_TYPE_COUNT}"

      # ============================================================
      # 6. 将大型 package.xml 拆分成较小的 Retrieve Manifest
      #
      # 同一个拆分文件中不重复放置相同 Metadata Type。
      # ============================================================
      - name: Split retrieve manifests
        shell: bash
        run: |
          set -euo pipefail

          cd "$SNAPSHOT_DIR"

          python3 <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          namespace = (
              "http://soap.sforce.com/2006/04/metadata"
          )

          ns = {
              "m": namespace,
          }

          ET.register_namespace(
              "",
              namespace,
          )

          source_file = Path(
              "manifest/package.xml"
          )

          output_directory = Path(
              "retrieve-manifests"
          )

          output_directory.mkdir(
              parents=True,
              exist_ok=True,
          )

          for existing_file in output_directory.glob(
              "*.xml"
          ):
              existing_file.unlink()

          tree = ET.parse(source_file)
          source_root = tree.getroot()

          version_element = source_root.find(
              "m:version",
              ns,
          )

          if (
              version_element is None
              or not version_element.text
          ):
              raise RuntimeError(
                  "package.xml 中缺少 API Version。"
              )

          api_version = version_element.text.strip()

          members_per_segment = 500
          max_segments_per_manifest = 10
          max_members_per_manifest = 2000

          segments = []

          for type_element in source_root.findall(
              "m:types",
              ns,
          ):
              name_element = type_element.find(
                  "m:name",
                  ns,
              )

              if (
                  name_element is None
                  or not name_element.text
              ):
                  continue

              metadata_type = (
                  name_element.text.strip()
              )

              members = [
                  member.text.strip()
                  for member in type_element.findall(
                      "m:members",
                      ns,
                  )
                  if (
                      member.text
                      and member.text.strip()
                  )
              ]

              if not members:
                  continue

              for start in range(
                  0,
                  len(members),
                  members_per_segment,
              ):
                  member_chunk = members[
                      start:
                      start + members_per_segment
                  ]

                  segments.append(
                      {
                          "type": metadata_type,
                          "members": member_chunk,
                      }
                  )

          manifests = []
          current_manifest = []
          current_member_count = 0
          current_types = set()

          for segment in segments:
              segment_type = segment["type"]
              segment_size = len(
                  segment["members"]
              )

              exceeds_segment_limit = (
                  len(current_manifest)
                  >= max_segments_per_manifest
              )

              exceeds_member_limit = (
                  current_member_count
                  + segment_size
                  > max_members_per_manifest
              )

              duplicates_type = (
                  segment_type in current_types
              )

              if current_manifest and (
                  exceeds_segment_limit
                  or exceeds_member_limit
                  or duplicates_type
              ):
                  manifests.append(
                      current_manifest
                  )

                  current_manifest = []
                  current_member_count = 0
                  current_types = set()

              current_manifest.append(segment)
              current_member_count += segment_size
              current_types.add(segment_type)

          if current_manifest:
              manifests.append(current_manifest)

          if not manifests:
              raise RuntimeError(
                  "package.xml 中没有找到可 Retrieve "
                  "的 Metadata。"
              )

          for index, manifest_segments in enumerate(
              manifests,
              start=1,
          ):
              package_root = ET.Element(
                  f"{{{namespace}}}Package"
              )

              for segment in manifest_segments:
                  types_element = ET.SubElement(
                      package_root,
                      f"{{{namespace}}}types",
                  )

                  for member_name in segment["members"]:
                      member_element = ET.SubElement(
                          types_element,
                          f"{{{namespace}}}members",
                      )

                      member_element.text = member_name

                  type_name_element = ET.SubElement(
                      types_element,
                      f"{{{namespace}}}name",
                  )

                  type_name_element.text = (
                      segment["type"]
                  )

              output_version = ET.SubElement(
                  package_root,
                  f"{{{namespace}}}version",
              )

              output_version.text = api_version

              output_file = output_directory / (
                  f"package-{index:03d}.xml"
              )

              ET.ElementTree(
                  package_root
              ).write(
                  output_file,
                  encoding="UTF-8",
                  xml_declaration=True,
              )

          print(
              f"Generated {len(manifests)} "
              f"retrieve manifests."
          )
          PYTHON

          MANIFEST_COUNT="$(
            find retrieve-manifests \
              -maxdepth 1 \
              -type f \
              -name 'package-*.xml' \
              | wc -l \
              | tr -d '[:space:]'
          )"

          if [ "$MANIFEST_COUNT" -eq 0 ]; then
            echo "::error::没有生成 Retrieve Manifest。"
            exit 1
          fi

          echo "RETRIEVE_MANIFEST_COUNT=${MANIFEST_COUNT}" \
            >> "$GITHUB_ENV"

          echo "Retrieve manifest count: ${MANIFEST_COUNT}"

      # ============================================================
      # 7. 逐批下载 Metadata
      #
      # 不使用 --target-org。
      # Salesforce CLI 自动读取 SF_TARGET_ORG。
      # SF_TARGET_ORG 来自 DEV_SFDX_AUTH_URL 登录结果。
      # ============================================================
      - name: Retrieve Metadata in SFDX format
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SF_TARGET_ORG:-}" ]; then
            echo "::error::未识别到 DEV_SFDX_AUTH_URL 对应的 Salesforce Org。"
            exit 1
          fi

          cd "$SNAPSHOT_DIR"

          # 验证进入新 SFDX 项目后，SF_TARGET_ORG 仍然生效
          # 不使用 --target-org
          sf org display \
            --json \
            > /dev/null

          FAILED_FILE="FAILED_RETRIEVES.txt"

          : > "$FAILED_FILE"

          SUCCESS_COUNT=0
          FAILED_COUNT=0

          while IFS= read -r MANIFEST_FILE; do
            echo "========================================"
            echo "Retrieving: ${MANIFEST_FILE}"
            echo "Org source: DEV_SFDX_AUTH_URL"
            echo "========================================"

            if sf project retrieve start \
              --manifest "$MANIFEST_FILE" \
              --ignore-conflicts \
              --wait 120
            then
              SUCCESS_COUNT=$(
                (SUCCESS_COUNT + 1)
              )
            else
              FAILED_COUNT=$(
                (FAILED_COUNT + 1)
              )

              basename "$MANIFEST_FILE" \
                >> "$FAILED_FILE"

              echo "::warning::Retrieve failed: ${MANIFEST_FILE}"
            fi

          done < <(
            find retrieve-manifests \
              -maxdepth 1 \
              -type f \
              -name 'package-*.xml' \
              | sort
          )

          if [ "$FAILED_COUNT" -eq 0 ]; then
            rm -f "$FAILED_FILE"
          fi

          METADATA_FILE_COUNT="$(
            find force-app/main/default \
              -type f \
              | wc -l \
              | tr -d '[:space:]'
          )"

          if [ "$METADATA_FILE_COUNT" -eq 0 ]; then
            echo "::error::没有下载到任何 Metadata 文件。"
            exit 1
          fi

          echo "SUCCESSFUL_RETRIEVE_COUNT=${SUCCESS_COUNT}" \
            >> "$GITHUB_ENV"

          echo "FAILED_RETRIEVE_COUNT=${FAILED_COUNT}" \
            >> "$GITHUB_ENV"

          echo "METADATA_FILE_COUNT=${METADATA_FILE_COUNT}" \
            >> "$GITHUB_ENV"

          echo "Successful retrieves: ${SUCCESS_COUNT}"
          echo "Failed retrieves: ${FAILED_COUNT}"
          echo "Metadata files: ${METADATA_FILE_COUNT}"

      # ============================================================
      # 8. 根据实际下载文件生成准确的 Manifest
      # ============================================================
      - name: Generate retrieved Metadata manifest
        shell: bash
        run: |
          set -euo pipefail

          cd "$SNAPSHOT_DIR"

          rm -rf retrieved-manifest
          mkdir -p retrieved-manifest

          sf project generate manifest \
            --source-dir force-app \
            --output-dir retrieved-manifest \
            --type package

          if [ ! -s "retrieved-manifest/package.xml" ]; then
            echo "::error::无法根据下载结果生成 Manifest。"
            exit 1
          fi

          mv \
            retrieved-manifest/package.xml \
            manifest/retrieved-package.xml

          rm -rf retrieved-manifest

      # ============================================================
      # 9. 生成只包含 Metadata 名称的清单
      #
      # 不写 XML 内容。
      # 不写 Metadata 配置值。
      # 每行只写一个 Metadata 名称。
      # ============================================================
      - name: Generate Metadata name list
        shell: bash
        run: |
          set -euo pipefail

          cd "$SNAPSHOT_DIR"

          read -r \
            METADATA_NAME_COUNT \
            METADATA_TYPE_COUNT \
            < <(
              python3 <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          namespace = {
              "m": (
                  "http://soap.sforce.com/"
                  "2006/04/metadata"
              )
          }

          manifest_file = Path(
              "manifest/retrieved-package.xml"
          )

          tree = ET.parse(manifest_file)
          root = tree.getroot()

          metadata_names = set()
          metadata_types = set()

          for type_element in root.findall(
              "m:types",
              namespace,
          ):
              type_name_element = type_element.find(
                  "m:name",
                  namespace,
              )

              if (
                  type_name_element is not None
                  and type_name_element.text
              ):
                  metadata_types.add(
                      type_name_element.text.strip()
                  )

              for member_element in (
                  type_element.findall(
                      "m:members",
                      namespace,
                  )
              ):
                  if member_element.text:
                      metadata_names.add(
                          member_element.text.strip()
                      )

          sorted_names = sorted(
              metadata_names,
              key=str.casefold,
          )

          output_file = Path(
              "METADATA_LIST.txt"
          )

          output_text = "\n".join(
              sorted_names
          )

          if output_text:
              output_text += "\n"

          output_file.write_text(
              output_text,
              encoding="utf-8",
          )

          print(
              len(metadata_names),
              len(metadata_types),
          )
          PYTHON
          )

          if [ ! -s "METADATA_LIST.txt" ]; then
            echo "::error::Metadata 清单为空。"
            exit 1
          fi

          echo "METADATA_NAME_COUNT=${METADATA_NAME_COUNT}" \
            >> "$GITHUB_ENV"

          echo "METADATA_TYPE_COUNT=${METADATA_TYPE_COUNT}" \
            >> "$GITHUB_ENV"

          echo "Metadata name count: ${METADATA_NAME_COUNT}"
          echo "Metadata type count: ${METADATA_TYPE_COUNT}"

      # ============================================================
      # 10. 生成快照说明
      # ============================================================
      - name: Generate snapshot information
        shell: bash
        run: |
          set -euo pipefail

          GENERATED_AT="$(
            date +'%Y-%m-%d %H:%M:%S %Z'
          )"

          cat > "$SNAPSHOT_DIR/SNAPSHOT_INFO.md" <<EOF
          # Salesforce Metadata Snapshot

          - Environment: ${ENVIRONMENT_NAME}
          - Salesforce Org ID: ${DETECTED_ORG_ID}
          - Query scope: ${SCOPE_LABEL}
          - Query value: ${QUERY_SCOPE}
          - Query source: ${QUERY_SOURCE}
          - Natural language query: ${QUERY_TEXT}
          - Snapshot date: ${TODAY}
          - Generated at: ${GENERATED_AT}
          - Timezone: Asia/Shanghai
          - Source format: Salesforce DX Source Format
          - Discovered type count: ${DISCOVERED_TYPE_COUNT}
          - Retrieved Metadata type count: ${METADATA_TYPE_COUNT}
          - Metadata name count: ${METADATA_NAME_COUNT}
          - Metadata file count: ${METADATA_FILE_COUNT}
          - Successful retrieve batches: ${SUCCESSFUL_RETRIEVE_COUNT}
          - Failed retrieve batches: ${FAILED_RETRIEVE_COUNT}

          ## Metadata list

          Metadata names are stored in:

          \`\`\`text
          METADATA_LIST.txt
          \`\`\`

          The list contains Metadata names only.

          It does not contain Metadata XML content,
          field definitions, source code, or configuration values.
          EOF

      # ============================================================
      # 11. 删除临时拆分 Manifest
      # ============================================================
      - name: Remove temporary retrieve manifests
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "$SNAPSHOT_DIR/retrieve-manifests"

      # ============================================================
      # 12. 输出 GitHub Actions Summary
      # ============================================================
      - name: Write workflow summary
        shell: bash
        run: |
          {
            echo "## Salesforce Metadata Query"
            echo ""
            echo "| 项目 | 结果 |"
            echo "|---|---|"
            echo "| 环境 | ${ENVIRONMENT_NAME} |"
            echo "| Salesforce Org ID | ${DETECTED_ORG_ID} |"
            echo "| 时区 | Asia/Shanghai |"
            echo "| 查询范围 | ${SCOPE_LABEL} |"
            echo "| 查询来源 | ${QUERY_SOURCE} |"
            echo "| 自然语言查询 | ${QUERY_TEXT} |"
            echo "| 快照目录 | \`${SNAPSHOT_DIR}\` |"
            echo "| 发现的 Metadata 类型数 | ${DISCOVERED_TYPE_COUNT} |"
            echo "| 成功下载的 Metadata 类型数 | ${METADATA_TYPE_COUNT} |"
            echo "| Metadata 名称数 | ${METADATA_NAME_COUNT} |"
            echo "| Metadata 文件数 | ${METADATA_FILE_COUNT} |"
            echo "| 成功批次 | ${SUCCESSFUL_RETRIEVE_COUNT} |"
            echo "| 失败批次 | ${FAILED_RETRIEVE_COUNT} |"
            echo "| 清单文件 | \`${SNAPSHOT_DIR}/METADATA_LIST.txt\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # 13. 提交查询结果
      # ============================================================
      - name: Commit Metadata snapshot
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$DATE_ROOT"

          if git diff --cached --quiet; then
            echo "Metadata 查询结果没有变化，无需提交。"
            exit 0
          fi

          git commit \
            -m "chore(metadata): query ${QUERY_SCOPE} ${ENVIRONMENT_NAME} ${TODAY}"

          git pull \
            --rebase \
            origin \
            main

          git push \
            origin \
            HEAD:main

          echo "Metadata snapshot committed successfully."

      # ============================================================
      # 14. 验证 Retrieve 结果
      #
      # 即使部分批次失败，前面的成功结果和失败清单仍会先提交。
      # ============================================================
      - name: Validate retrieve result
        shell: bash
        run: |
          set -euo pipefail

          if [ "$FAILED_RETRIEVE_COUNT" -gt 0 ]; then
            echo "::error::存在 ${FAILED_RETRIEVE_COUNT} 个 Retrieve 批次失败。"
            echo "已成功下载的 Metadata 和失败清单仍已提交。"
            exit 1
          fi

          echo "All Metadata retrieve batches completed successfully."
