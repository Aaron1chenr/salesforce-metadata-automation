name: Salesforce Metadata Snapshot

on:
  workflow_dispatch:
    inputs:
      metadata_types:
        description: "可选。多个 Metadata 类型使用英文逗号分隔；留空默认查询全部可访问 Metadata"
        required: false
        default: ""
        type: string

      environment_name:
        description: "可选。留空时根据 DEV_SFDX_AUTH_URL 对应 Org 的地址自动识别"
        required: false
        default: ""
        type: string

      request_id:
        description: "Salesforce Cursor__c 请求 ID，用于定位记录并回写 Execution_Result__c"
        required: true
        type: string

  repository_dispatch:
    types:
      - cursor-salesforce-metadata-snapshot

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: salesforce-metadata-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retrieve-salesforce-metadata:
    name: Retrieve Salesforce Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      SNAPSHOT_ROOT: salesforce-metadata-snapshots

      REQUESTED_METADATA_TYPES: >-
        ${{ inputs.metadata_types ||
            github.event.client_payload.metadata_types ||
            '' }}

      REQUESTED_ENVIRONMENT_NAME: >-
        ${{ inputs.environment_name ||
            github.event.client_payload.environment_name ||
            '' }}

      REQUEST_ID: >-
        ${{ inputs.request_id ||
            github.event.client_payload.request_id ||
            github.event.client_payload.requestId ||
            '' }}

      CURSOR_REQUEST_ID_FIELD: ${{ vars.CURSOR_REQUEST_ID_FIELD || 'Request_Id__c' }}

      SF_LIST_METADATA_BATCH_SIZE: "5"

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate Salesforce callback input
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${REQUEST_ID:-}" ]; then
            echo "::error::request_id 不能为空。Workflow 必须通过请求 ID 定位对应的 Cursor__c 记录。"
            exit 1
          fi

          if [ "${#REQUEST_ID}" -gt 100 ]; then
            echo "::error::request_id 长度不能超过 100 个字符。"
            exit 1
          fi

          if [[ ! "${CURSOR_REQUEST_ID_FIELD}" =~ ^[A-Za-z][A-Za-z0-9_]*(__c)?$ ]]; then
            echo "::error::CURSOR_REQUEST_ID_FIELD 不是有效的 Salesforce 字段 API Name：${CURSOR_REQUEST_ID_FIELD}"
            exit 1
          fi

          echo "Request ID: ${REQUEST_ID}"
          echo "Cursor request field: ${CURSOR_REQUEST_ID_FIELD}"

      - name: Install Salesforce CLI
        shell: bash
        run: |
          set -euo pipefail

          npm install --global @salesforce/cli

          echo "Salesforce CLI version:"
          sf --version

          sf data update bulk --help >/dev/null
          sf sobject describe --help >/dev/null

      - name: Authenticate Org from DEV_SFDX_AUTH_URL
        id: salesforce_auth
        shell: bash
        env:
          SALESFORCE_AUTH_URL: ${{ secrets.DEV_SFDX_AUTH_URL }}
        run: |
          set -euo pipefail

          if [ -z "${SALESFORCE_AUTH_URL:-}" ]; then
            echo "::error::GitHub Secret DEV_SFDX_AUTH_URL 未配置或为空。"
            exit 1
          fi

          AUTH_FILE="${RUNNER_TEMP}/dev-sfdx-auth-url.txt"
          AUTH_RESULT="${RUNNER_TEMP}/salesforce-auth-result.json"
          ORG_DISPLAY="${RUNNER_TEMP}/salesforce-org-display.json"

          AUTH_ALIAS="metadata-snapshot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          umask 077
          printf '%s' "${SALESFORCE_AUTH_URL}" > "${AUTH_FILE}"

          set +e

          sf org login sfdx-url \
            --sfdx-url-file "${AUTH_FILE}" \
            --alias "${AUTH_ALIAS}" \
            --json \
            > "${AUTH_RESULT}"

          AUTH_EXIT_CODE=$?

          set -e

          if [ "${AUTH_EXIT_CODE}" -ne 0 ]; then
            AUTH_ERROR="$(
              jq -r \
                '.message // .name // "Salesforce Org 登录失败。"' \
                "${AUTH_RESULT}" 2>/dev/null || true
            )"

            echo "::error::${AUTH_ERROR}"

            rm -f \
              "${AUTH_FILE}" \
              "${AUTH_RESULT}" \
              "${ORG_DISPLAY}"

            exit "${AUTH_EXIT_CODE}"
          fi

          ORG_USERNAME="$(
            jq -r '.result.username // empty' "${AUTH_RESULT}"
          )"

          if [ -z "${ORG_USERNAME}" ]; then
            echo "::error::已读取 DEV_SFDX_AUTH_URL，但未能识别对应 Org Username。"

            rm -f \
              "${AUTH_FILE}" \
              "${AUTH_RESULT}" \
              "${ORG_DISPLAY}"

            exit 1
          fi

          export SF_TARGET_ORG="${ORG_USERNAME}"

          sf org display \
            --target-org "${ORG_USERNAME}" \
            --json \
            > "${ORG_DISPLAY}"

          ORG_ID="$(
            jq -r \
              '.result.id // .result.orgId // empty' \
              "${ORG_DISPLAY}"
          )"

          INSTANCE_URL="$(
            jq -r \
              '.result.instanceUrl // empty' \
              "${ORG_DISPLAY}"
          )"

          ORG_STATUS="$(
            jq -r \
              '.result.connectedStatus // "Unknown"' \
              "${ORG_DISPLAY}"
          )"

          if [ -z "${ORG_ID}" ] || [ -z "${INSTANCE_URL}" ]; then
            echo "::error::无法从 DEV_SFDX_AUTH_URL 对应 Org 中识别 Org ID 或 Instance URL。"

            rm -f \
              "${AUTH_FILE}" \
              "${AUTH_RESULT}" \
              "${ORG_DISPLAY}"

            exit 1
          fi

          echo "SF_TARGET_ORG=${ORG_USERNAME}" >> "${GITHUB_ENV}"
          echo "SALESFORCE_ORG_USERNAME=${ORG_USERNAME}" >> "${GITHUB_ENV}"
          echo "SALESFORCE_ORG_ID=${ORG_ID}" >> "${GITHUB_ENV}"
          echo "SALESFORCE_INSTANCE_URL=${INSTANCE_URL}" >> "${GITHUB_ENV}"
          echo "SALESFORCE_ORG_STATUS=${ORG_STATUS}" >> "${GITHUB_ENV}"
          echo "SALESFORCE_AUTH_ALIAS=${AUTH_ALIAS}" >> "${GITHUB_ENV}"

          echo "org_id=${ORG_ID}" >> "${GITHUB_OUTPUT}"
          echo "instance_url=${INSTANCE_URL}" >> "${GITHUB_OUTPUT}"
          echo "username=${ORG_USERNAME}" >> "${GITHUB_OUTPUT}"

          rm -f \
            "${AUTH_FILE}" \
            "${AUTH_RESULT}" \
            "${ORG_DISPLAY}"

          echo "Salesforce Org 识别成功。"
          echo "Org ID: ${ORG_ID}"
          echo "Instance URL: ${INSTANCE_URL}"
          echo "Connected Status: ${ORG_STATUS}"

      - name: Authenticate Salesforce callback Org
        if: env.REQUEST_ID != ''
        shell: bash
        env:
          CALLBACK_SALESFORCE_AUTH_URL: ${{ secrets.CALLBACK_SFDX_AUTH_URL || secrets.DEV_SFDX_AUTH_URL }}
        run: |
          set -euo pipefail

          if [ -z "${CALLBACK_SALESFORCE_AUTH_URL:-}" ]; then
            echo "::error::CALLBACK_SFDX_AUTH_URL 与 DEV_SFDX_AUTH_URL 均未配置。"
            exit 1
          fi

          CALLBACK_AUTH_FILE="${RUNNER_TEMP}/callback-sfdx-auth-url.txt"
          CALLBACK_AUTH_RESULT="${RUNNER_TEMP}/salesforce-callback-auth-result.json"
          CALLBACK_ORG_DISPLAY="${RUNNER_TEMP}/salesforce-callback-org-display.json"
          CALLBACK_AUTH_ALIAS="metadata-callback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          umask 077
          printf '%s' "${CALLBACK_SALESFORCE_AUTH_URL}" > "${CALLBACK_AUTH_FILE}"

          set +e

          sf org login sfdx-url \
            --sfdx-url-file "${CALLBACK_AUTH_FILE}" \
            --alias "${CALLBACK_AUTH_ALIAS}" \
            --json \
            > "${CALLBACK_AUTH_RESULT}"

          CALLBACK_AUTH_EXIT_CODE=$?

          set -e

          if [ "${CALLBACK_AUTH_EXIT_CODE}" -ne 0 ]; then
            CALLBACK_AUTH_ERROR="$(
              jq -r \
                '.message // .name // "Salesforce callback Org 登录失败。"' \
                "${CALLBACK_AUTH_RESULT}" 2>/dev/null || true
            )"

            echo "::error::${CALLBACK_AUTH_ERROR}"
            exit "${CALLBACK_AUTH_EXIT_CODE}"
          fi

          CALLBACK_ORG_USERNAME="$(
            jq -r '.result.username // empty' "${CALLBACK_AUTH_RESULT}"
          )"

          if [ -z "${CALLBACK_ORG_USERNAME}" ]; then
            echo "::error::无法识别回写 Salesforce Org 的 Username。"
            exit 1
          fi

          sf org display \
            --target-org "${CALLBACK_ORG_USERNAME}" \
            --json \
            > "${CALLBACK_ORG_DISPLAY}"

          CALLBACK_INSTANCE_URL="$(
            jq -r '.result.instanceUrl // empty' "${CALLBACK_ORG_DISPLAY}"
          )"

          CALLBACK_ORG_ID="$(
            jq -r \
              '.result.id // .result.orgId // empty' \
              "${CALLBACK_ORG_DISPLAY}"
          )"

          if [ -z "${CALLBACK_INSTANCE_URL}" ] ||
             [ -z "${CALLBACK_ORG_ID}" ]; then

            echo "::error::无法识别回写 Salesforce Org 的 Instance URL 或 Org ID。"
            exit 1
          fi

          echo "CALLBACK_SALESFORCE_ORG_USERNAME=${CALLBACK_ORG_USERNAME}" >> "${GITHUB_ENV}"
          echo "CALLBACK_SALESFORCE_INSTANCE_URL=${CALLBACK_INSTANCE_URL}" >> "${GITHUB_ENV}"
          echo "CALLBACK_SALESFORCE_ORG_ID=${CALLBACK_ORG_ID}" >> "${GITHUB_ENV}"
          echo "CALLBACK_SALESFORCE_AUTH_ALIAS=${CALLBACK_AUTH_ALIAS}" >> "${GITHUB_ENV}"

          rm -f \
            "${CALLBACK_AUTH_FILE}" \
            "${CALLBACK_AUTH_RESULT}" \
            "${CALLBACK_ORG_DISPLAY}"

          echo "Salesforce callback Org 识别成功。"
          echo "Callback Org ID: ${CALLBACK_ORG_ID}"
          echo "Callback Instance URL: ${CALLBACK_INSTANCE_URL}"

      - name: Resolve Cursor record by request ID
        id: resolve_cursor_record
        if: env.REQUEST_ID != '' && env.CALLBACK_SALESFORCE_ORG_USERNAME != ''
        shell: bash
        run: |
          set -euo pipefail

          QUERY_RESULT="${RUNNER_TEMP}/salesforce-cursor-request-query.json"

          ESCAPED_REQUEST_ID="$(
            python3 <<'PY_ESCAPE'
          import os

          value = os.environ["REQUEST_ID"]
          print(
              value.replace("\\", "\\\\").replace("'", "\\'"),
              end="",
          )
          PY_ESCAPE
          )"

          SOQL="SELECT Id, ${CURSOR_REQUEST_ID_FIELD} FROM Cursor__c WHERE ${CURSOR_REQUEST_ID_FIELD} = '${ESCAPED_REQUEST_ID}' ORDER BY CreatedDate DESC LIMIT 2"

          sf data query \
            --query "${SOQL}" \
            --target-org "${CALLBACK_SALESFORCE_ORG_USERNAME}" \
            --json \
            > "${QUERY_RESULT}"

          MATCH_COUNT="$(
            jq -r '.result.totalSize // 0' "${QUERY_RESULT}"
          )"

          if [ "${MATCH_COUNT}" -eq 0 ]; then
            echo "::error::未找到 ${CURSOR_REQUEST_ID_FIELD} = ${REQUEST_ID} 的 Cursor__c 记录。"
            exit 1
          fi

          if [ "${MATCH_COUNT}" -gt 1 ]; then
            echo "::error::请求 ID ${REQUEST_ID} 匹配到多条 Cursor__c 记录。请将 ${CURSOR_REQUEST_ID_FIELD} 配置为 Unique。"
            exit 1
          fi

          RESOLVED_CURSOR_RECORD_ID="$(
            jq -r '.result.records[0].Id // empty' "${QUERY_RESULT}"
          )"

          if [[ ! "${RESOLVED_CURSOR_RECORD_ID}" =~ ^[A-Za-z0-9]{15,18}$ ]]; then
            echo "::error::未能从请求 ID 解析出有效的 Cursor__c 记录 ID。"
            exit 1
          fi

          echo "RESOLVED_CURSOR_RECORD_ID=${RESOLVED_CURSOR_RECORD_ID}" >> "${GITHUB_ENV}"
          echo "cursor_record_id=${RESOLVED_CURSOR_RECORD_ID}" >> "${GITHUB_OUTPUT}"

          rm -f "${QUERY_RESULT}"

          echo "Cursor__c record resolved by request ID."
          echo "Resolved record ID: ${RESOLVED_CURSOR_RECORD_ID}"

      - name: Mark Salesforce request as running
        if: steps.resolve_cursor_record.outputs.cursor_record_id != ''
        shell: bash
        run: |
          set -euo pipefail

          echo "Callback implementation: stable-bulk-update-v1"

          RUNNING_CSV="${RUNNER_TEMP}/salesforce-callback-running.csv"
          RUNNING_UPDATE_JSON="${RUNNER_TEMP}/salesforce-callback-running-update.json"
          RUNNING_UPDATE_STDERR="${RUNNER_TEMP}/salesforce-callback-running-update.stderr"

          export RUNNING_CSV
          export REQUEST_ID
          export RESOLVED_CURSOR_RECORD_ID
          export GITHUB_WORKFLOW

          python3 <<'PY_RUNNING_CSV'
          import csv
          import os
          from pathlib import Path

          record_id = os.environ["RESOLVED_CURSOR_RECORD_ID"]
          request_id = os.environ["REQUEST_ID"]
          workflow_name = os.environ.get(
              "GITHUB_WORKFLOW",
              "Salesforce Metadata Snapshot",
          )

          value = (
              "执行状态：GitHub Action 已启动\n"
              f"请求 ID：{request_id}\n"
              f"Workflow：{workflow_name}\n"
              "正在从 DEV_SFDX_AUTH_URL 对应的 Org 查询 Metadata，"
              "请稍后刷新当前记录。"
          )

          output = Path(os.environ["RUNNING_CSV"])

          with output.open(
              "w",
              encoding="utf-8",
              newline="",
          ) as handle:
              writer = csv.writer(
                  handle,
                  quoting=csv.QUOTE_ALL,
                  lineterminator="\n",
              )

              writer.writerow([
                  "Id",
                  "Execution_Result__c",
              ])

              writer.writerow([
                  record_id,
                  value,
              ])
          PY_RUNNING_CSV

          set +e

          sf data update bulk \
            --sobject "Cursor__c" \
            --file "${RUNNING_CSV}" \
            --target-org "${CALLBACK_SALESFORCE_ORG_USERNAME}" \
            --line-ending LF \
            --wait 10 \
            --json \
            > "${RUNNING_UPDATE_JSON}" \
            2> "${RUNNING_UPDATE_STDERR}"

          UPDATE_EXIT_CODE=$?

          set -e

          if [ "${UPDATE_EXIT_CODE}" -ne 0 ]; then
            echo "::error::标记 Cursor__c 请求为执行中失败。"

            if [ -s "${RUNNING_UPDATE_STDERR}" ]; then
              sed -n '1,160p' \
                "${RUNNING_UPDATE_STDERR}" >&2
            fi

            if [ -s "${RUNNING_UPDATE_JSON}" ]; then
              jq '
                del(
                  .result.accessToken,
                  .result.refreshToken,
                  .result.sfdxAuthUrl
                )
              ' "${RUNNING_UPDATE_JSON}" 2>/dev/null ||
                cat "${RUNNING_UPDATE_JSON}"
            fi

            exit "${UPDATE_EXIT_CODE}"
          fi

          if ! jq -e \
            '.status == 0' \
            "${RUNNING_UPDATE_JSON}" \
            >/dev/null; then

            echo "::error::Salesforce 返回了非成功状态，未能标记请求为执行中。"

            jq '.' "${RUNNING_UPDATE_JSON}" 2>/dev/null ||
              cat "${RUNNING_UPDATE_JSON}"

            exit 1
          fi

          RUNNING_FAILED_COUNT="$(
            jq -r \
              '.result.numberRecordsFailed // 0' \
              "${RUNNING_UPDATE_JSON}"
          )"

          if [ "${RUNNING_FAILED_COUNT}" != "0" ]; then
            echo "::error::标记执行中时 Salesforce 报告 ${RUNNING_FAILED_COUNT} 条记录失败。"

            jq '.' "${RUNNING_UPDATE_JSON}" 2>/dev/null ||
              cat "${RUNNING_UPDATE_JSON}"

            exit 1
          fi

          echo "Cursor__c 已标记为执行中。"

          rm -f \
            "${RUNNING_CSV}" \
            "${RUNNING_UPDATE_JSON}" \
            "${RUNNING_UPDATE_STDERR}"

      - name: Resolve environment and snapshot directory
        id: snapshot_context
        shell: bash
        run: |
          set -euo pipefail

          TODAY="$(
            TZ=Asia/Singapore date '+%Y-%m-%d'
          )"

          INSTANCE_URL="${SALESFORCE_INSTANCE_URL}"
          ENVIRONMENT_OVERRIDE="${REQUESTED_ENVIRONMENT_NAME}"

          HOST="${INSTANCE_URL#http://}"
          HOST="${HOST#https://}"
          HOST="${HOST%%/*}"

          RAW_ENVIRONMENT=""

          if [ -n "${ENVIRONMENT_OVERRIDE}" ]; then
            RAW_ENVIRONMENT="${ENVIRONMENT_OVERRIDE}"

          elif [[ "${HOST}" == *".sandbox."* ]]; then
            DOMAIN_PREFIX="${HOST%%.*}"

            if [[ "${DOMAIN_PREFIX}" == *"--"* ]]; then
              RAW_ENVIRONMENT="${DOMAIN_PREFIX##*--}"
            else
              RAW_ENVIRONMENT="SANDBOX"
            fi

          elif [[ "${HOST}" == *".scratch."* ]]; then
            RAW_ENVIRONMENT="SCRATCH"

          else
            RAW_ENVIRONMENT="PROD"
          fi

          ENVIRONMENT_NAME="$(
            printf '%s' "${RAW_ENVIRONMENT}" |
              tr '[:lower:]' '[:upper:]' |
              sed -E \
                -e 's/[^A-Z0-9._-]+/-/g' \
                -e 's/^-+//' \
                -e 's/-+$//'
          )"

          if [ -z "${ENVIRONMENT_NAME}" ]; then
            echo "::error::无法生成有效的环境名称。"
            exit 1
          fi

          PROJECT_NAME="${TODAY}_${ENVIRONMENT_NAME}"
          SNAPSHOT_DIR="${SNAPSHOT_ROOT}/${PROJECT_NAME}"

          BRANCH_ENVIRONMENT="$(
            printf '%s' "${ENVIRONMENT_NAME}" |
              tr '[:upper:]' '[:lower:]'
          )"

          BRANCH_NAME="cursor/metadata-snapshot-${TODAY}-${BRANCH_ENVIRONMENT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "snapshot_date=${TODAY}" >> "${GITHUB_OUTPUT}"
          echo "environment_name=${ENVIRONMENT_NAME}" >> "${GITHUB_OUTPUT}"
          echo "project_name=${PROJECT_NAME}" >> "${GITHUB_OUTPUT}"
          echo "snapshot_dir=${SNAPSHOT_DIR}" >> "${GITHUB_OUTPUT}"
          echo "branch_name=${BRANCH_NAME}" >> "${GITHUB_OUTPUT}"

          echo "SNAPSHOT_DATE=${TODAY}" >> "${GITHUB_ENV}"
          echo "ENVIRONMENT_NAME=${ENVIRONMENT_NAME}" >> "${GITHUB_ENV}"
          echo "PROJECT_NAME=${PROJECT_NAME}" >> "${GITHUB_ENV}"
          echo "SNAPSHOT_DIR=${SNAPSHOT_DIR}" >> "${GITHUB_ENV}"
          echo "SNAPSHOT_BRANCH=${BRANCH_NAME}" >> "${GITHUB_ENV}"

          echo "Environment: ${ENVIRONMENT_NAME}"
          echo "Snapshot directory: ${SNAPSHOT_DIR}"
          echo "Branch: ${BRANCH_NAME}"

      - name: Generate independent SFDX project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "${SNAPSHOT_DIR}"
          mkdir -p "${SNAPSHOT_ROOT}"

          sf project generate \
            --name "${PROJECT_NAME}" \
            --output-dir "${SNAPSHOT_ROOT}"

          if [ ! -f "${SNAPSHOT_DIR}/sfdx-project.json" ]; then
            echo "::error::SFDX 项目生成失败，未找到 sfdx-project.json。"
            exit 1
          fi

          mkdir -p \
            "${SNAPSHOT_DIR}/manifest" \
            "${SNAPSHOT_DIR}/force-app/main/default" \
            "${SNAPSHOT_DIR}/reports"

      - name: Generate package.xml from identified Org
        id: manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST_RESULT="${RUNNER_TEMP}/manifest-generation-result.json"

          RAW_METADATA_TYPES="$(
            printf '%s' "${REQUESTED_METADATA_TYPES:-}" |
              tr -d '\r\n'
          )"

          cd "${SNAPSHOT_DIR}"

          MANIFEST_COMMAND=(
            sf project generate manifest
            --from-org "${SF_TARGET_ORG}"
            --output-dir "manifest"
            --type package
            --json
          )

          if [ -z "${RAW_METADATA_TYPES}" ]; then
            METADATA_SCOPE="ALL_DISCOVERABLE_METADATA"
            METADATA_MODE="ALL"

            echo "metadata_types 未填写。"
            echo "开始扫描当前 Org 中全部可访问 Metadata。"

          else
            IFS=',' read -r -a METADATA_TYPE_ARRAY <<< "${RAW_METADATA_TYPES}"

            NORMALIZED_TYPES=()

            for RAW_TYPE in "${METADATA_TYPE_ARRAY[@]}"; do
              METADATA_TYPE="$(
                printf '%s' "${RAW_TYPE}" |
                  xargs
              )"

              if [ -z "${METADATA_TYPE}" ]; then
                continue
              fi

              if [[ ! "${METADATA_TYPE}" =~ ^[A-Za-z][A-Za-z0-9_]*$ ]]; then
                echo "::error::无效的 Metadata 类型：${METADATA_TYPE}"
                exit 1
              fi

              NORMALIZED_TYPES+=("${METADATA_TYPE}")
              MANIFEST_COMMAND+=(--metadata "${METADATA_TYPE}")
            done

            if [ "${#NORMALIZED_TYPES[@]}" -eq 0 ]; then
              echo "::error::metadata_types 已填写，但没有识别到有效 Metadata 类型。"
              exit 1
            fi

            METADATA_SCOPE="$(
              IFS=','
              echo "${NORMALIZED_TYPES[*]}"
            )"

            METADATA_MODE="SELECTED"

            echo "仅扫描指定 Metadata 类型：${METADATA_SCOPE}"
          fi

          set +e

          "${MANIFEST_COMMAND[@]}" > "${MANIFEST_RESULT}"

          MANIFEST_EXIT_CODE=$?

          set -e

          if [ "${MANIFEST_EXIT_CODE}" -ne 0 ]; then
            MANIFEST_ERROR="$(
              jq -r \
                '.message //
                 .result.message //
                 .name //
                 "生成 Salesforce Metadata Manifest 失败。"' \
                "${MANIFEST_RESULT}" 2>/dev/null || true
            )"

            echo "::error::${MANIFEST_ERROR}"

            rm -f "${MANIFEST_RESULT}"

            exit "${MANIFEST_EXIT_CODE}"
          fi

          PACKAGE_XML="manifest/package.xml"

          if [ ! -f "${PACKAGE_XML}" ]; then
            echo "::error::Manifest 命令执行完成，但未生成 manifest/package.xml。"

            if [ -f "${MANIFEST_RESULT}" ]; then
              cat "${MANIFEST_RESULT}"
            fi

            rm -f "${MANIFEST_RESULT}"

            exit 1
          fi

          TYPE_COUNT="$(
            grep -c '<name>' "${PACKAGE_XML}" || true
          )"

          MEMBER_COUNT="$(
            grep -c '<members>' "${PACKAGE_XML}" || true
          )"

          if [ "${TYPE_COUNT}" -eq 0 ]; then
            echo "::error::生成的 package.xml 中没有 Metadata 类型。"

            rm -f "${MANIFEST_RESULT}"

            exit 1
          fi

          echo "metadata_mode=${METADATA_MODE}" >> "${GITHUB_OUTPUT}"
          echo "metadata_scope=${METADATA_SCOPE}" >> "${GITHUB_OUTPUT}"
          echo "metadata_type_count=${TYPE_COUNT}" >> "${GITHUB_OUTPUT}"
          echo "metadata_member_count=${MEMBER_COUNT}" >> "${GITHUB_OUTPUT}"

          echo "METADATA_MODE=${METADATA_MODE}" >> "${GITHUB_ENV}"
          echo "METADATA_SCOPE=${METADATA_SCOPE}" >> "${GITHUB_ENV}"
          echo "METADATA_TYPE_COUNT=${TYPE_COUNT}" >> "${GITHUB_ENV}"
          echo "METADATA_MEMBER_COUNT=${MEMBER_COUNT}" >> "${GITHUB_ENV}"

          echo "Manifest generation completed."
          echo "Metadata mode: ${METADATA_MODE}"
          echo "Metadata scope: ${METADATA_SCOPE}"
          echo "Metadata type count: ${TYPE_COUNT}"
          echo "Metadata member count: ${MEMBER_COUNT}"

          rm -f "${MANIFEST_RESULT}"

      - name: Retrieve metadata from identified Org
        id: retrieve
        shell: bash
        run: |
          set -euo pipefail

          RETRIEVE_RESULT="${RUNNER_TEMP}/salesforce-retrieve-result.json"

          cd "${SNAPSHOT_DIR}"

          set +e

          sf project retrieve start \
            --manifest "manifest/package.xml" \
            --wait 120 \
            --ignore-conflicts \
            --json \
            > "${RETRIEVE_RESULT}"

          RETRIEVE_EXIT_CODE=$?

          set -e

          if [ "${RETRIEVE_EXIT_CODE}" -ne 0 ]; then
            RETRIEVE_ERROR="$(
              jq -r \
                '.message //
                 .result.errorMessage //
                 .result.details.componentFailures[0].problem //
                 .name //
                 "Salesforce Metadata 查询失败。"' \
                "${RETRIEVE_RESULT}" 2>/dev/null || true
            )"

            echo "::error::${RETRIEVE_ERROR}"

            if [ -f "${RETRIEVE_RESULT}" ]; then
              echo "Retrieve result:"

              jq \
                'del(
                  .result.accessToken,
                  .result.sfdxAuthUrl,
                  .result.refreshToken
                )' \
                "${RETRIEVE_RESULT}" 2>/dev/null || true
            fi

            rm -f "${RETRIEVE_RESULT}"

            exit "${RETRIEVE_EXIT_CODE}"
          fi

          FILE_COUNT="$(
            jq -r \
              '(
                .result.files //
                .result.fileResponses //
                []
              ) | length' \
              "${RETRIEVE_RESULT}"
          )"

          OBJECT_COUNT="0"

          if [ -d "force-app/main/default/objects" ]; then
            OBJECT_COUNT="$(
              find "force-app/main/default/objects" \
                -mindepth 1 \
                -maxdepth 1 \
                -type d |
                wc -l |
                xargs
            )"
          fi

          SOURCE_FILE_COUNT="$(
            find "force-app/main/default" \
              -type f |
              wc -l |
              xargs
          )"

          echo "file_count=${FILE_COUNT}" >> "${GITHUB_OUTPUT}"
          echo "source_file_count=${SOURCE_FILE_COUNT}" >> "${GITHUB_OUTPUT}"
          echo "object_count=${OBJECT_COUNT}" >> "${GITHUB_OUTPUT}"

          echo "Metadata retrieve completed."
          echo "Retrieved result files: ${FILE_COUNT}"
          echo "Retrieved source files: ${SOURCE_FILE_COUNT}"
          echo "Retrieved object directories: ${OBJECT_COUNT}"

          rm -f "${RETRIEVE_RESULT}"

      - name: Generate Metadata inventory tables
        id: metadata_table
        shell: bash
        run: |
          set -euo pipefail

          cd "${SNAPSHOT_DIR}"

          export INVENTORY_MANIFEST="manifest/package.xml"
          export INVENTORY_MARKDOWN="reports/metadata-inventory.md"
          export INVENTORY_CSV="reports/metadata-inventory.csv"
          export TYPE_SUMMARY_MARKDOWN="reports/metadata-type-summary.md"
          export INVENTORY_JSON="reports/metadata-inventory.json"

          python3 <<'PY_INVENTORY'
          import csv
          import json
          import os
          import xml.etree.ElementTree as ET
          from collections import Counter
          from pathlib import Path

          manifest_path = Path(os.environ["INVENTORY_MANIFEST"])
          markdown_path = Path(os.environ["INVENTORY_MARKDOWN"])
          csv_path = Path(os.environ["INVENTORY_CSV"])
          summary_path = Path(os.environ["TYPE_SUMMARY_MARKDOWN"])
          json_path = Path(os.environ["INVENTORY_JSON"])

          if not manifest_path.is_file():
              raise SystemExit(f"Manifest 不存在：{manifest_path}")

          markdown_path.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          namespace = {
              "m": "http://soap.sforce.com/2006/04/metadata"
          }

          root = ET.parse(manifest_path).getroot()

          rows = []

          for type_node in root.findall("m:types", namespace):
              name_node = type_node.find("m:name", namespace)

              metadata_type = (
                  name_node.text.strip()
                  if name_node is not None and name_node.text
                  else "Unknown"
              )

              members = []

              for member_node in type_node.findall(
                  "m:members",
                  namespace,
              ):
                  if member_node.text and member_node.text.strip():
                      members.append(member_node.text.strip())

              for member_name in sorted(
                  set(members),
                  key=str.casefold,
              ):
                  rows.append((
                      metadata_type,
                      member_name,
                  ))

          rows.sort(
              key=lambda item: (
                  item[0].casefold(),
                  item[1].casefold(),
              )
          )

          if not rows:
              raise SystemExit(
                  "package.xml 中未发现任何 Metadata 名称。"
              )

          with csv_path.open(
              "w",
              encoding="utf-8-sig",
              newline="",
          ) as handle:
              writer = csv.writer(handle)

              writer.writerow([
                  "序号",
                  "Metadata 类型",
                  "Metadata 名称",
              ])

              for index, (
                  metadata_type,
                  member_name,
              ) in enumerate(rows, start=1):
                  writer.writerow([
                      index,
                      metadata_type,
                      member_name,
                  ])

          inventory = [
              {
                  "index": index,
                  "metadataType": metadata_type,
                  "metadataName": member_name,
              }
              for index, (
                  metadata_type,
                  member_name,
              ) in enumerate(rows, start=1)
          ]

          json_path.write_text(
              json.dumps(
                  inventory,
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          with markdown_path.open(
              "w",
              encoding="utf-8",
              newline="\n",
          ) as handle:
              handle.write(
                  "# Salesforce Metadata 名称清单\n\n"
              )

              handle.write(
                  f"共 **{len(rows)}** 个 Metadata 组件。\n\n"
              )

              handle.write(
                  "| 序号 | Metadata 类型 | Metadata 名称 |\n"
              )

              handle.write(
                  "|---:|---|---|\n"
              )

              for index, (
                  metadata_type,
                  member_name,
              ) in enumerate(rows, start=1):
                  safe_type = (
                      metadata_type
                      .replace("|", "\\|")
                      .replace("\n", " ")
                  )

                  safe_name = (
                      member_name
                      .replace("|", "\\|")
                      .replace("\n", " ")
                  )

                  handle.write(
                      f"| {index} | `{safe_type}` | `{safe_name}` |\n"
                  )

          type_counts = Counter(
              metadata_type
              for metadata_type, _ in rows
          )

          with summary_path.open(
              "w",
              encoding="utf-8",
              newline="\n",
          ) as handle:
              handle.write(
                  "# Salesforce Metadata 类型汇总\n\n"
              )

              handle.write(
                  f"共 **{len(type_counts)}** 种 Metadata 类型、"
                  f"**{len(rows)}** 个组件。\n\n"
              )

              handle.write(
                  "| Metadata 类型 | 组件数量 |\n"
              )

              handle.write(
                  "|---|---:|\n"
              )

              for metadata_type in sorted(
                  type_counts,
                  key=str.casefold,
              ):
                  safe_type = (
                      metadata_type
                      .replace("|", "\\|")
                      .replace("\n", " ")
                  )

                  handle.write(
                      f"| `{safe_type}` | "
                      f"{type_counts[metadata_type]} |\n"
                  )

          output_path = Path(
              os.environ["GITHUB_OUTPUT"]
          )

          with output_path.open(
              "a",
              encoding="utf-8",
          ) as handle:
              handle.write(
                  f"metadata_row_count={len(rows)}\n"
              )

              handle.write(
                  "metadata_table_type_count="
                  f"{len(type_counts)}\n"
              )

              handle.write(
                  "metadata_markdown="
                  f"{markdown_path.as_posix()}\n"
              )

              handle.write(
                  "metadata_csv="
                  f"{csv_path.as_posix()}\n"
              )

              handle.write(
                  "metadata_json="
                  f"{json_path.as_posix()}\n"
              )

              handle.write(
                  "type_summary_markdown="
                  f"{summary_path.as_posix()}\n"
              )

          print("Metadata inventory table generated.")
          print(f"Metadata components: {len(rows)}")
          print(f"Metadata types: {len(type_counts)}")
          print(f"Markdown: {markdown_path.as_posix()}")
          print(f"CSV: {csv_path.as_posix()}")
          print(f"JSON: {json_path.as_posix()}")
          PY_INVENTORY

      - name: Generate snapshot information
        shell: bash
        run: |
          set -euo pipefail

          RETRIEVED_AT="$(
            TZ=Asia/Singapore date --iso-8601=seconds
          )"

          jq -n \
            --arg snapshotDate "${SNAPSHOT_DATE}" \
            --arg environmentName "${ENVIRONMENT_NAME}" \
            --arg orgId "${SALESFORCE_ORG_ID}" \
            --arg instanceUrl "${SALESFORCE_INSTANCE_URL}" \
            --arg retrievedAt "${RETRIEVED_AT}" \
            --arg metadataMode "${METADATA_MODE}" \
            --arg metadataScope "${METADATA_SCOPE}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg workflowRunId "${GITHUB_RUN_ID}" \
            --arg workflowRunAttempt "${GITHUB_RUN_ATTEMPT}" \
            --arg triggeredBy "${GITHUB_ACTOR}" \
            --arg metadataInventoryMarkdown "reports/metadata-inventory.md" \
            --arg metadataInventoryCsv "reports/metadata-inventory.csv" \
            --arg metadataInventoryJson "reports/metadata-inventory.json" \
            --arg metadataTypeSummaryMarkdown "reports/metadata-type-summary.md" \
            --argjson metadataTypeCount "${METADATA_TYPE_COUNT}" \
            --argjson metadataMemberCount "${METADATA_MEMBER_COUNT}" \
            --argjson metadataInventoryRowCount "${{ steps.metadata_table.outputs.metadata_row_count }}" \
            --argjson metadataInventoryTypeCount "${{ steps.metadata_table.outputs.metadata_table_type_count }}" \
            --argjson retrievedFileCount "${{ steps.retrieve.outputs.file_count }}" \
            --argjson retrievedSourceFileCount "${{ steps.retrieve.outputs.source_file_count }}" \
            --argjson retrievedObjectCount "${{ steps.retrieve.outputs.object_count }}" \
            '{
              snapshotDate: $snapshotDate,
              environmentName: $environmentName,
              salesforceOrgId: $orgId,
              instanceUrl: $instanceUrl,
              retrievedAt: $retrievedAt,
              metadataSelection: {
                mode: $metadataMode,
                scope: $metadataScope,
                discoveredTypeCount: $metadataTypeCount,
                discoveredMemberCount: $metadataMemberCount
              },
              metadataInventory: {
                rowCount: $metadataInventoryRowCount,
                typeCount: $metadataInventoryTypeCount,
                markdown: $metadataInventoryMarkdown,
                csv: $metadataInventoryCsv,
                json: $metadataInventoryJson,
                typeSummaryMarkdown: $metadataTypeSummaryMarkdown
              },
              retrievalResult: {
                retrievedFileCount: $retrievedFileCount,
                retrievedSourceFileCount: $retrievedSourceFileCount,
                retrievedObjectCount: $retrievedObjectCount
              },
              source: {
                repository: $repository,
                workflowRunId: $workflowRunId,
                workflowRunAttempt: $workflowRunAttempt,
                triggeredBy: $triggeredBy
              }
            }' \
            > "${SNAPSHOT_DIR}/snapshot-info.json"

      - name: Verify snapshot structure
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "${SNAPSHOT_DIR}/sfdx-project.json"
            "${SNAPSHOT_DIR}/manifest/package.xml"
            "${SNAPSHOT_DIR}/snapshot-info.json"
            "${SNAPSHOT_DIR}/reports/metadata-inventory.md"
            "${SNAPSHOT_DIR}/reports/metadata-inventory.csv"
            "${SNAPSHOT_DIR}/reports/metadata-inventory.json"
            "${SNAPSHOT_DIR}/reports/metadata-type-summary.md"
          )

          for REQUIRED_FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "${REQUIRED_FILE}" ]; then
              echo "::error::缺少必要文件：${REQUIRED_FILE}"
              exit 1
            fi
          done

          if [ ! -d "${SNAPSHOT_DIR}/force-app/main/default" ]; then
            echo "::error::缺少 SFDX source 目录：force-app/main/default"
            exit 1
          fi

          PACKAGE_TYPE_COUNT="$(
            grep -c '<name>' \
              "${SNAPSHOT_DIR}/manifest/package.xml" || true
          )"

          if [ "${PACKAGE_TYPE_COUNT}" -eq 0 ]; then
            echo "::error::package.xml 不包含任何 Metadata 类型。"
            exit 1
          fi

          echo "Snapshot project structure:"

          SNAPSHOT_FILE_LIST="${RUNNER_TEMP}/snapshot-file-list.txt"

          find "${SNAPSHOT_DIR}" \
            -maxdepth 5 \
            -type f \
            -print \
            > "${SNAPSHOT_FILE_LIST}.unsorted"

          LC_ALL=C sort \
            "${SNAPSHOT_FILE_LIST}.unsorted" \
            > "${SNAPSHOT_FILE_LIST}"

          SNAPSHOT_FILE_COUNT="$(
            wc -l < "${SNAPSHOT_FILE_LIST}" |
              xargs
          )"

          sed -n '1,300p' "${SNAPSHOT_FILE_LIST}"

          if [ "${SNAPSHOT_FILE_COUNT}" -gt 300 ]; then
            echo "... 仅展示前 300 个文件；快照文件总数：${SNAPSHOT_FILE_COUNT}"
          else
            echo "快照文件总数：${SNAPSHOT_FILE_COUNT}"
          fi

          rm -f \
            "${SNAPSHOT_FILE_LIST}" \
            "${SNAPSHOT_FILE_LIST}.unsorted"

      - name: Add Metadata tables to Actions summary
        shell: bash
        run: |
          set -euo pipefail

          INVENTORY_FILE="${SNAPSHOT_DIR}/reports/metadata-inventory.md"
          TYPE_SUMMARY_FILE="${SNAPSHOT_DIR}/reports/metadata-type-summary.md"
          SUMMARY_SIZE_LIMIT=900000

          {
            echo "## Salesforce Metadata Snapshot"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| Environment | ${ENVIRONMENT_NAME} |"
            echo "| Org ID | ${SALESFORCE_ORG_ID} |"
            echo "| Instance URL | ${SALESFORCE_INSTANCE_URL} |"
            echo "| Metadata Mode | ${METADATA_MODE} |"
            echo "| Metadata Scope | ${METADATA_SCOPE} |"
            echo "| Metadata 类型数量 | ${{ steps.metadata_table.outputs.metadata_table_type_count }} |"
            echo "| Metadata 名称数量 | ${{ steps.metadata_table.outputs.metadata_row_count }} |"
            echo "| Snapshot Directory | \`${SNAPSHOT_DIR}\` |"
            echo "| 完整 Markdown 表格 | \`${SNAPSHOT_DIR}/reports/metadata-inventory.md\` |"
            echo "| 完整 CSV 表格 | \`${SNAPSHOT_DIR}/reports/metadata-inventory.csv\` |"
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

          cat "${TYPE_SUMMARY_FILE}" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"

          INVENTORY_SIZE="$(
            wc -c < "${INVENTORY_FILE}" |
              xargs
          )"

          if [ "${INVENTORY_SIZE}" -le "${SUMMARY_SIZE_LIMIT}" ]; then
            cat "${INVENTORY_FILE}" >> "${GITHUB_STEP_SUMMARY}"
          else
            {
              echo "## Metadata 名称清单预览"
              echo ""
              echo "> 完整表格较大，已保存到 \`${SNAPSHOT_DIR}/reports/metadata-inventory.md\` 和 CSV 文件。"
              echo ""
            } >> "${GITHUB_STEP_SUMMARY}"

            sed -n '1,203p' \
              "${INVENTORY_FILE}" \
              >> "${GITHUB_STEP_SUMMARY}"

            {
              echo ""
              echo "> Actions Summary 仅显示前 200 条，仓库文件包含全部 ${{ steps.metadata_table.outputs.metadata_row_count }} 条。"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload metadata snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: salesforce-metadata-${{ steps.snapshot_context.outputs.snapshot_date }}-${{ steps.snapshot_context.outputs.environment_name }}
          path: ${{ steps.snapshot_context.outputs.snapshot_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Create snapshot branch and commit
        id: git_commit
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "${SNAPSHOT_BRANCH}"

          git add "${SNAPSHOT_DIR}"

          if git diff --cached --quiet; then
            echo "::notice::本次查询未产生文件变化，不创建 Pull Request。"
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git commit \
            -m "chore: snapshot ${ENVIRONMENT_NAME} metadata ${SNAPSHOT_DATE}"

          git push \
            --set-upstream \
            origin \
            "${SNAPSHOT_BRANCH}"

          echo "has_changes=true" >> "${GITHUB_OUTPUT}"

      - name: Create normal Pull Request
        if: steps.git_commit.outputs.has_changes == 'true'
        id: create_pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PR_BODY="${RUNNER_TEMP}/metadata-snapshot-pr.md"

          cat > "${PR_BODY}" <<EOF
          ## Salesforce Metadata Snapshot

          本 Pull Request 由 GitHub Actions 自动创建。

          ### 查询来源

          - Environment: ${ENVIRONMENT_NAME}
          - Salesforce Org ID: ${SALESFORCE_ORG_ID}
          - Instance URL: ${SALESFORCE_INSTANCE_URL}
          - Metadata Mode: ${METADATA_MODE}
          - Metadata Scope: ${METADATA_SCOPE}
          - Discovered Metadata Types: ${METADATA_TYPE_COUNT}
          - Discovered Metadata Members: ${METADATA_MEMBER_COUNT}
          - Snapshot Date: ${SNAPSHOT_DATE}

          ### 保存位置

          \`${SNAPSHOT_DIR}\`

          ### Metadata 表格

          - 完整 Markdown 表格：\`${SNAPSHOT_DIR}/reports/metadata-inventory.md\`
          - 完整 CSV 表格：\`${SNAPSHOT_DIR}/reports/metadata-inventory.csv\`
          - 完整 JSON 清单：\`${SNAPSHOT_DIR}/reports/metadata-inventory.json\`
          - 类型汇总表：\`${SNAPSHOT_DIR}/reports/metadata-type-summary.md\`
          - Metadata 类型数量：${{ steps.metadata_table.outputs.metadata_table_type_count }}
          - Metadata 名称数量：${{ steps.metadata_table.outputs.metadata_row_count }}

          ### 查询结果

          - Retrieved Result Files: ${{ steps.retrieve.outputs.file_count }}
          - Retrieved Source Files: ${{ steps.retrieve.outputs.source_file_count }}
          - Retrieved Objects: ${{ steps.retrieve.outputs.object_count }}
          - Workflow Run ID: ${GITHUB_RUN_ID}

          本次执行未保存或输出 DEV_SFDX_AUTH_URL、Access Token 或 Refresh Token。
          EOF

          PR_URL="$(
            gh pr create \
              --base main \
              --head "${SNAPSHOT_BRANCH}" \
              --title "chore: snapshot ${ENVIRONMENT_NAME} Salesforce metadata ${SNAPSHOT_DATE}" \
              --body-file "${PR_BODY}"
          )"

          echo "pr_url=${PR_URL}" >> "${GITHUB_OUTPUT}"
          echo "Pull Request created: ${PR_URL}"

      - name: Add Pull Request result to summary
        if: always()
        shell: bash
        run: |
          {
            echo ""
            echo "## 执行结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| Retrieved Result Files | ${{ steps.retrieve.outputs.file_count || '0' }} |"
            echo "| Retrieved Source Files | ${{ steps.retrieve.outputs.source_file_count || '0' }} |"
            echo "| Retrieved Objects | ${{ steps.retrieve.outputs.object_count || '0' }} |"
            echo "| Metadata 表格行数 | ${{ steps.metadata_table.outputs.metadata_row_count || '0' }} |"
            echo "| Pull Request | ${{ steps.create_pr.outputs.pr_url || 'Not created' }} |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Return Metadata table to Salesforce Cursor record
        if: always() && steps.resolve_cursor_record.outputs.cursor_record_id != '' && env.CALLBACK_SALESFORCE_ORG_USERNAME != ''
        shell: bash
        env:
          WORKFLOW_JOB_STATUS: ${{ job.status }}
          PR_URL: ${{ steps.create_pr.outputs.pr_url }}
          METADATA_ROW_COUNT: ${{ steps.metadata_table.outputs.metadata_row_count }}
          METADATA_TYPE_COUNT_CALLBACK: ${{ steps.metadata_table.outputs.metadata_table_type_count }}
          RETRIEVED_SOURCE_FILE_COUNT: ${{ steps.retrieve.outputs.source_file_count }}
          RETRIEVED_OBJECT_COUNT: ${{ steps.retrieve.outputs.object_count }}
        run: |
          set -euo pipefail

          echo "Callback implementation: stable-bulk-update-v1"

          CALLBACK_DESCRIBE="${RUNNER_TEMP}/salesforce-cursor-describe.json"
          DESCRIBE_STDERR="${RUNNER_TEMP}/salesforce-cursor-describe.stderr"
          CALLBACK_RESULT="${RUNNER_TEMP}/salesforce-execution-result.txt"
          CALLBACK_CSV="${RUNNER_TEMP}/salesforce-cursor-callback.csv"
          CALLBACK_UPDATE_JSON="${RUNNER_TEMP}/salesforce-cursor-update.json"
          CALLBACK_UPDATE_STDERR="${RUNNER_TEMP}/salesforce-cursor-update.stderr"

          set +e

          sf sobject describe \
            --sobject "Cursor__c" \
            --target-org "${CALLBACK_SALESFORCE_ORG_USERNAME}" \
            --json \
            > "${CALLBACK_DESCRIBE}" \
            2> "${DESCRIBE_STDERR}"

          DESCRIBE_EXIT_CODE=$?

          set -e

          if [ "${DESCRIBE_EXIT_CODE}" -ne 0 ]; then
            echo "::error::读取 Cursor__c 对象描述失败。"

            if [ -s "${DESCRIBE_STDERR}" ]; then
              sed -n '1,160p' \
                "${DESCRIBE_STDERR}" >&2
            fi

            if [ -s "${CALLBACK_DESCRIBE}" ]; then
              jq -r \
                '.message // .name // .' \
                "${CALLBACK_DESCRIBE}" \
                2>/dev/null || true
            fi

            exit "${DESCRIBE_EXIT_CODE}"
          fi

          if ! jq -e \
            '.status == 0 and (.result.fields | type == "array")' \
            "${CALLBACK_DESCRIBE}" \
            >/dev/null; then

            echo "::error::Cursor__c Describe 返回结构无效。"

            jq -r \
              '.message // .name // .' \
              "${CALLBACK_DESCRIBE}" \
              2>/dev/null || true

            exit 1
          fi

          FIELD_LENGTH="$(
            jq -r '
              .result.fields[]
              | select(.name == "Execution_Result__c")
              | .length // 0
            ' "${CALLBACK_DESCRIBE}"
          )"

          FIELD_HTML_FORMATTED="$(
            jq -r '
              .result.fields[]
              | select(.name == "Execution_Result__c")
              | .htmlFormatted // false
            ' "${CALLBACK_DESCRIBE}"
          )"

          FIELD_TYPE="$(
            jq -r '
              .result.fields[]
              | select(.name == "Execution_Result__c")
              | .type // "unknown"
            ' "${CALLBACK_DESCRIBE}"
          )"

          FIELD_UPDATEABLE="$(
            jq -r '
              .result.fields[]
              | select(.name == "Execution_Result__c")
              | .updateable // false
            ' "${CALLBACK_DESCRIBE}"
          )"

          if [ -z "${FIELD_LENGTH}" ] ||
             [ "${FIELD_LENGTH}" = "0" ]; then

            echo "::error::Cursor__c.Execution_Result__c 不存在，或当前回写用户无字段读取权限。"
            exit 1
          fi

          if [ "${FIELD_UPDATEABLE}" != "true" ]; then
            echo "::error::当前回写用户没有 Cursor__c.Execution_Result__c 的编辑权限。"
            exit 1
          fi

          echo "Execution_Result__c field type: ${FIELD_TYPE}"
          echo "Execution_Result__c configured length: ${FIELD_LENGTH}"
          echo "Execution_Result__c HTML formatted: ${FIELD_HTML_FORMATTED}"

          export FIELD_LENGTH
          export FIELD_HTML_FORMATTED
          export FIELD_TYPE
          export WORKFLOW_JOB_STATUS
          export REQUEST_ID
          export RESOLVED_CURSOR_RECORD_ID
          export GITHUB_REPOSITORY
          export GITHUB_RUN_ID
          export GITHUB_WORKFLOW
          export PR_URL
          export METADATA_ROW_COUNT
          export METADATA_TYPE_COUNT_CALLBACK
          export RETRIEVED_SOURCE_FILE_COUNT
          export RETRIEVED_OBJECT_COUNT
          export CALLBACK_RESULT
          export CALLBACK_CSV
          export SNAPSHOT_DIR
          export ENVIRONMENT_NAME
          export SALESFORCE_ORG_ID
          export SALESFORCE_INSTANCE_URL

          python3 <<'PY_CALLBACK'
          import csv
          import html
          import json
          import os
          from pathlib import Path

          field_length = int(
              os.environ.get("FIELD_LENGTH") or "0"
          )

          html_formatted = (
              os.environ
              .get("FIELD_HTML_FORMATTED", "false")
              .lower() == "true"
          )

          status = os.environ.get(
              "WORKFLOW_JOB_STATUS",
              "unknown",
          )

          success = status == "success"

          request_id = os.environ.get(
              "REQUEST_ID",
              "",
          )

          repo = os.environ.get(
              "GITHUB_REPOSITORY",
              "",
          )

          run_id = os.environ.get(
              "GITHUB_RUN_ID",
              "",
          )

          workflow_name = os.environ.get(
              "GITHUB_WORKFLOW",
              "",
          )

          pr_url = os.environ.get(
              "PR_URL",
              "",
          ).strip()

          run_url = (
              f"https://github.com/{repo}/actions/runs/{run_id}"
              if repo and run_id
              else ""
          )

          snapshot_dir = os.environ.get(
              "SNAPSHOT_DIR",
              "",
          )

          environment = os.environ.get(
              "ENVIRONMENT_NAME",
              "",
          )

          org_id = os.environ.get(
              "SALESFORCE_ORG_ID",
              "",
          )

          instance_url = os.environ.get(
              "SALESFORCE_INSTANCE_URL",
              "",
          )

          inventory_path = (
              Path(snapshot_dir)
              / "reports"
              / "metadata-inventory.json"
          )

          rows = []

          if inventory_path.is_file():
              try:
                  rows = json.loads(
                      inventory_path.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception:
                  rows = []

          configured_limit = max(
              field_length,
              1,
          )

          reserve = max(
              min(
                  configured_limit // 20,
                  1000,
              ),
              50,
          )

          content_limit = max(
              min(
                  configured_limit - reserve,
                  120000,
              ),
              100,
          )

          if html_formatted:
              status_label = (
                  "成功"
                  if success
                  else "失败"
              )

              status_color = (
                  "#2e844a"
                  if success
                  else "#ba0517"
              )

              parts = [
                  (
                      "<p><strong>执行状态：</strong>"
                      f'<span style="color:{status_color}">'
                      f"{status_label}</span></p>"
                  ),
                  (
                      '<table border="1" '
                      'cellpadding="4" '
                      'cellspacing="0">'
                  ),
                  "<tbody>",
                  (
                      "<tr><th>请求 ID</th><td>"
                      f"{html.escape(request_id)}"
                      "</td></tr>"
                  ),
                  (
                      "<tr><th>Workflow</th><td>"
                      f"{html.escape(workflow_name)}"
                      "</td></tr>"
                  ),
                  (
                      "<tr><th>环境</th><td>"
                      f"{html.escape(environment or '未识别')}"
                      "</td></tr>"
                  ),
                  (
                      "<tr><th>Org ID</th><td>"
                      f"{html.escape(org_id or '未识别')}"
                      "</td></tr>"
                  ),
                  (
                      "<tr><th>Instance URL</th><td>"
                      f"{html.escape(instance_url or '未识别')}"
                      "</td></tr>"
                  ),
                  (
                      "<tr><th>Metadata 类型数</th><td>"
                      f"{html.escape(os.environ.get('METADATA_TYPE_COUNT_CALLBACK') or '0')}"
                      "</td></tr>"
                  ),
                  (
                      "<tr><th>Metadata 名称数</th><td>"
                      f"{html.escape(os.environ.get('METADATA_ROW_COUNT') or '0')}"
                      "</td></tr>"
                  ),
                  (
                      "<tr><th>检索文件数</th><td>"
                      f"{html.escape(os.environ.get('RETRIEVED_SOURCE_FILE_COUNT') or '0')}"
                      "</td></tr>"
                  ),
                  (
                      "<tr><th>检索对象数</th><td>"
                      f"{html.escape(os.environ.get('RETRIEVED_OBJECT_COUNT') or '0')}"
                      "</td></tr>"
                  ),
                  "</tbody></table>",
              ]

              if run_url:
                  parts.append(
                      (
                          f'<p><a href="{html.escape(run_url)}" '
                          'target="_blank">'
                          "查看 GitHub Actions 执行记录"
                          "</a></p>"
                      )
                  )

              if pr_url:
                  parts.append(
                      (
                          f'<p><a href="{html.escape(pr_url)}" '
                          'target="_blank">'
                          "查看 Metadata Snapshot Pull Request"
                          "</a></p>"
                      )
                  )

              if not success:
                  parts.append(
                      (
                          "<p>Metadata 查询或后续处理失败。"
                          "请打开 GitHub Actions 执行记录"
                          "查看失败步骤。</p>"
                      )
                  )

              elif rows:
                  parts.extend([
                      (
                          "<p><strong>"
                          "Metadata 名称表"
                          "</strong></p>"
                      ),
                      (
                          '<table border="1" '
                          'cellpadding="4" '
                          'cellspacing="0">'
                      ),
                      (
                          "<thead><tr>"
                          "<th>序号</th>"
                          "<th>Metadata 类型</th>"
                          "<th>Metadata 名称</th>"
                          "</tr></thead>"
                      ),
                      "<tbody>",
                  ])

                  included = 0

                  for row in rows:
                      candidate = (
                          "<tr><td>"
                          f"{html.escape(str(row.get('index', '')))}"
                          "</td><td>"
                          f"{html.escape(str(row.get('metadataType', '')))}"
                          "</td><td>"
                          f"{html.escape(str(row.get('metadataName', '')))}"
                          "</td></tr>"
                      )

                      footer_reserve = 500

                      if (
                          sum(
                              len(part)
                              for part in parts
                          )
                          + len(candidate)
                          + footer_reserve
                          > content_limit
                      ):
                          break

                      parts.append(candidate)
                      included += 1

                  parts.append("</tbody></table>")

                  if included < len(rows):
                      parts.append(
                          (
                              "<p>Salesforce 字段长度限制："
                              f"当前显示 {included} / {len(rows)} 条。"
                              "完整清单请在 GitHub Actions Artifact "
                              "或 Pull Request 的 "
                              "reports/metadata-inventory.csv "
                              "中查看。</p>"
                          )
                      )
                  else:
                      parts.append(
                          (
                              "<p>已返回全部 "
                              f"{len(rows)} 条 Metadata 名称。</p>"
                          )
                      )

              else:
                  parts.append(
                      "<p>未生成 Metadata 名称清单。</p>"
                  )

              result = "".join(parts)

          else:
              lines = [
                  (
                      "执行状态："
                      f"{'成功' if success else '失败'}"
                  ),
                  f"请求 ID：{request_id}",
                  f"Workflow：{workflow_name}",
                  f"环境：{environment or '未识别'}",
                  f"Org ID：{org_id or '未识别'}",
                  f"Instance URL：{instance_url or '未识别'}",
                  (
                      "Metadata 类型数："
                      f"{os.environ.get('METADATA_TYPE_COUNT_CALLBACK') or '0'}"
                  ),
                  (
                      "Metadata 名称数："
                      f"{os.environ.get('METADATA_ROW_COUNT') or '0'}"
                  ),
                  (
                      "检索文件数："
                      f"{os.environ.get('RETRIEVED_SOURCE_FILE_COUNT') or '0'}"
                  ),
                  (
                      "检索对象数："
                      f"{os.environ.get('RETRIEVED_OBJECT_COUNT') or '0'}"
                  ),
                  f"GitHub Actions：{run_url}",
              ]

              if pr_url:
                  lines.append(
                      f"Pull Request：{pr_url}"
                  )

              lines.extend([
                  "",
                  "| 序号 | Metadata 类型 | Metadata 名称 |",
                  "|---:|---|---|",
              ])

              included = 0

              for row in rows:
                  candidate = (
                      f"| {row.get('index', '')} | "
                      f"{row.get('metadataType', '')} | "
                      f"{row.get('metadataName', '')} |"
                  )

                  footer_reserve = 300

                  if (
                      len(
                          "\n".join(
                              lines + [candidate]
                          )
                      )
                      + footer_reserve
                      > content_limit
                  ):
                      break

                  lines.append(candidate)
                  included += 1

              if included < len(rows):
                  lines.extend([
                      "",
                      (
                          "Salesforce 字段长度限制："
                          f"当前显示 {included} / {len(rows)} 条。"
                      ),
                      (
                          "完整清单请查看 GitHub Artifact "
                          "或 reports/metadata-inventory.csv。"
                      ),
                  ])

              result = "\n".join(lines)

          if len(result) > content_limit:
              result = result[:content_limit]

          result_path = Path(
              os.environ["CALLBACK_RESULT"]
          )

          result_path.write_text(
              result,
              encoding="utf-8",
          )

          callback_csv = Path(
              os.environ["CALLBACK_CSV"]
          )

          with callback_csv.open(
              "w",
              encoding="utf-8",
              newline="",
          ) as handle:
              writer = csv.writer(
                  handle,
                  quoting=csv.QUOTE_ALL,
                  lineterminator="\n",
              )

              writer.writerow([
                  "Id",
                  "Execution_Result__c",
              ])

              writer.writerow([
                  os.environ["RESOLVED_CURSOR_RECORD_ID"],
                  result,
              ])
          PY_CALLBACK

          set +e

          sf data update bulk \
            --sobject "Cursor__c" \
            --file "${CALLBACK_CSV}" \
            --target-org "${CALLBACK_SALESFORCE_ORG_USERNAME}" \
            --line-ending LF \
            --wait 10 \
            --json \
            > "${CALLBACK_UPDATE_JSON}" \
            2> "${CALLBACK_UPDATE_STDERR}"

          UPDATE_EXIT_CODE=$?

          set -e

          if [ "${UPDATE_EXIT_CODE}" -ne 0 ]; then
            echo "::error::Cursor__c.Execution_Result__c 回写失败。"

            if [ -s "${CALLBACK_UPDATE_STDERR}" ]; then
              echo "Salesforce CLI stderr:" >&2

              sed -n '1,200p' \
                "${CALLBACK_UPDATE_STDERR}" >&2
            fi

            if [ -s "${CALLBACK_UPDATE_JSON}" ]; then
              echo "Salesforce CLI result:"

              jq '
                del(
                  .result.accessToken,
                  .result.refreshToken,
                  .result.sfdxAuthUrl
                )
              ' "${CALLBACK_UPDATE_JSON}" 2>/dev/null ||
                cat "${CALLBACK_UPDATE_JSON}"
            fi

            exit "${UPDATE_EXIT_CODE}"
          fi

          if ! jq -e \
            '.status == 0' \
            "${CALLBACK_UPDATE_JSON}" \
            >/dev/null; then

            echo "::error::Salesforce 返回了非成功状态。"

            jq '.' \
              "${CALLBACK_UPDATE_JSON}" \
              2>/dev/null ||
              cat "${CALLBACK_UPDATE_JSON}"

            exit 1
          fi

          FAILED_COUNT="$(
            jq -r \
              '.result.numberRecordsFailed // 0' \
              "${CALLBACK_UPDATE_JSON}"
          )"

          PROCESSED_COUNT="$(
            jq -r \
              '.result.numberRecordsProcessed // 0' \
              "${CALLBACK_UPDATE_JSON}"
          )"

          JOB_STATE="$(
            jq -r \
              '.result.state // "Unknown"' \
              "${CALLBACK_UPDATE_JSON}"
          )"

          if [ "${FAILED_COUNT}" != "0" ]; then
            echo "::error::Salesforce Bulk Update 报告 ${FAILED_COUNT} 条记录失败。"

            jq '.' \
              "${CALLBACK_UPDATE_JSON}" \
              2>/dev/null ||
              cat "${CALLBACK_UPDATE_JSON}"

            exit 1
          fi

          echo "Salesforce Cursor__c.Execution_Result__c 回写成功。"
          echo "Bulk job state: ${JOB_STATE}"
          echo "Processed records: ${PROCESSED_COUNT}"
          echo "Failed records: ${FAILED_COUNT}"

          rm -f \
            "${CALLBACK_DESCRIBE}" \
            "${DESCRIBE_STDERR}" \
            "${CALLBACK_RESULT}" \
            "${CALLBACK_CSV}" \
            "${CALLBACK_UPDATE_JSON}" \
            "${CALLBACK_UPDATE_STDERR}"

      - name: Logout Salesforce Org and clean temporary files
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e

          if [ -n "${CALLBACK_SALESFORCE_ORG_USERNAME:-}" ]; then
            sf org logout \
              --target-org "${CALLBACK_SALESFORCE_ORG_USERNAME}" \
              --no-prompt \
              >/dev/null 2>&1
          fi

          if [ -n "${SALESFORCE_ORG_USERNAME:-}" ]; then
            sf org logout \
              --target-org "${SALESFORCE_ORG_USERNAME}" \
              --no-prompt \
              >/dev/null 2>&1
          fi

          rm -f \
            "${RUNNER_TEMP}/dev-sfdx-auth-url.txt" \
            "${RUNNER_TEMP}/salesforce-auth-result.json" \
            "${RUNNER_TEMP}/salesforce-org-display.json" \
            "${RUNNER_TEMP}/manifest-generation-result.json" \
            "${RUNNER_TEMP}/salesforce-retrieve-result.json" \
            "${RUNNER_TEMP}/salesforce-callback-running.csv" \
            "${RUNNER_TEMP}/salesforce-callback-running-update.json" \
            "${RUNNER_TEMP}/salesforce-callback-running-update.stderr" \
            "${RUNNER_TEMP}/salesforce-cursor-describe.json" \
            "${RUNNER_TEMP}/salesforce-cursor-describe.stderr" \
            "${RUNNER_TEMP}/salesforce-execution-result.txt" \
            "${RUNNER_TEMP}/salesforce-cursor-callback.csv" \
            "${RUNNER_TEMP}/salesforce-cursor-update.json" \
            "${RUNNER_TEMP}/salesforce-cursor-update.stderr" \
            "${RUNNER_TEMP}/callback-sfdx-auth-url.txt" \
            "${RUNNER_TEMP}/salesforce-callback-auth-result.json" \
            "${RUNNER_TEMP}/salesforce-callback-org-display.json" \
            "${RUNNER_TEMP}/salesforce-cursor-request-query.json"

          exit 0
